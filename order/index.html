  let rows='<div class="row"><span>'+esc(T.base)+'</span><span>'+money(p.base_amount_ils)+'</span></div>';
  if(p.extra_days>0)rows+='<div class="row muted"><span>'+esc(T.extra)+' · '+p.extra_days+'</span><span>+'+money(p.extra_days_amount_ils)+'</span></div>';
  if(p.avia_days>0)rows+='<div class="row"><span>'+esc(T.avia)+' · '+p.avia_days+'</span><span>+'+money(p.avia_amount_ils)+'</span></div>';
  else rows+='<div class="row muted"><span>'+esc(T.aviaOptional)+' · '+money(p.avia_optional_amount_ils)+'</span><span>'+esc(T.notIncluded)+'</span></div>';
  $('#priceRows').innerHTML=rows;$('#totalLabel').textContent=T.total;$('#totalValue').textContent=money(p.total_ils);
  $('#supplierNote').textContent=T.supplier;$('#guaranteeTitle').textContent=T.gTitle;$('#guaranteeText').textContent=T.gText;
  $('#payTitle').textContent=T.payTitle;$('#payText').textContent=D.status==='paid'?T.paidState:T.payText;
  $('#payBtnText').textContent=T.payBtn;$('#paidBtn').textContent=T.paid;$('#questionBtn').textContent=T.question;$('#footerText').textContent=T.footer;
  $('#providerText').textContent=T.provider;$('#payBtn').href=D.payment.url;$('#paidBtn').href=D.whatsapp_return;
  if(D.status==='paid'){$('#payBtn').style.display='none'}
  $('#content').hidden=false;$('#loading').classList.add('hide');
}
async function load(){
 const q=new URLSearchParams(location.search);const path=location.pathname.split('/').filter(Boolean);const code=(q.get('code')||(path[0]==='order'?path[1]:null)||'').toUpperCase();
 if(!code)throw Error('missing');
 const r=await fetch(API+'?code='+encodeURIComponent(code),{cache:'no-store'});if(!r.ok)throw Error('not_found');D=await r.json();render();
}
load().catch(()=>{$('#loading').innerHTML='<div class="error"><img src="/assets/navigam/logo.png" style="width:145px"><h2>NAVIGAM</h2><p>'+esc(T.error)+'</p></div>'});
</script>
