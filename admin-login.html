<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b6578">
<title>TRIPLY Admin Login</title>
<style>
:root{--ink:#123f4b;--muted:#738a91;--teal:#0b7c90;--teal2:#0d5c73;--line:#dce9ec}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(180deg,#eef8fa,#fff 35%,#f6fbfc);font-family:Arial,"Noto Sans Hebrew",sans-serif;color:var(--ink);padding:18px}
.card{width:min(520px,100%);background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 18px 50px rgba(17,74,88,.10)}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:18px}.mark{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--teal),#17324d);display:grid;place-items:center;color:#fff;font-weight:900}.brand h1{font-size:21px;margin:0}.brand p{font-size:11px;color:var(--muted);margin:3px 0 0}
h2{margin:0 0 6px;font-size:24px}p{font-size:13px;line-height:1.6;color:var(--muted)}label{display:block;font-size:11px;font-weight:800;margin:14px 0 6px}input{width:100%;border:1px solid #cfe0e4;border-radius:12px;padding:12px;background:#fff;font:inherit;outline:none}input:focus{border-color:#6bb9c5;box-shadow:0 0 0 3px rgba(11,124,144,.08)}button{width:100%;border:0;border-radius:12px;padding:12px 14px;margin-top:12px;background:linear-gradient(135deg,var(--teal),var(--teal2));color:#fff;font:inherit;font-weight:800;cursor:pointer}button:disabled{opacity:.55;cursor:default}.notice{display:none;margin-top:12px;padding:10px 12px;border-radius:12px;background:#f1f8fa;color:#5d747c;font-size:11px;line-height:1.6}.notice.error{background:#fff1ef;color:#a94539}.loading{text-align:center;padding:8px 0;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<section class="card">
  <div class="brand"><div class="mark">T</div><div><h1>TRIPLY Admin</h1><p>מערכת ניהול</p></div></div>
  <div id="loginView">
    <h2>כניסה למערכת</h2>
    <p>הכנס את כתובת המייל של מנהל TRIPLY. נשלח קישור כניסה חד־פעמי.</p>
    <label for="email">אימייל</label>
    <input id="email" type="email" autocomplete="email" placeholder="name@example.com">
    <button id="sendBtn">שלח קישור כניסה</button>
    <div id="msg" class="notice"></div>
  </div>
  <div id="callbackView" style="display:none"><div class="loading">מאמת את קישור הכניסה…</div></div>
</section>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const CORE_URL='https://asnnvwoersrhrgdantll.supabase.co';
const CORE_KEY='sb_publishable_dZFP2IUafSBsNpsnc4e4Mw_rU0FQFJh';
const supabase=createClient(CORE_URL,CORE_KEY,{auth:{flowType:'implicit',detectSessionInUrl:false,persistSession:true,autoRefreshToken:true}});
const $=s=>document.querySelector(s);
function showMsg(text,isError=false){const el=$('#msg');el.textContent=text;el.className='notice'+(isError?' error':'');el.style.display='block'}
async function handleCallback(){
  const q=new URLSearchParams(location.search||'');
  const h=new URLSearchParams((location.hash||'').replace(/^#/,''));
  const callbackError=h.get('error_description')||q.get('error_description')||h.get('error')||q.get('error');
  const access=h.get('access_token');
  const refresh=h.get('refresh_token');
  const code=q.get('code');
  const hasCallback=!!(callbackError||access||code);
  if(!hasCallback)return false;
  $('#loginView').style.display='none';$('#callbackView').style.display='block';
  try{
    if(callbackError)throw new Error(callbackError);
    if(access){
      if(!refresh)throw new Error('Missing refresh token');
      const {error}=await supabase.auth.setSession({access_token:access,refresh_token:refresh});
      if(error)throw error;
    }else if(code){
      const {error}=await supabase.auth.exchangeCodeForSession(code);
      if(error)throw error;
    }
    history.replaceState({},document.title,'/admin');
    location.replace('/admin.html');
    return true;
  }catch(error){
    console.error('TRIPLY admin auth callback failed',error);
    $('#callbackView').innerHTML='<div class="notice error" style="display:block">קישור הכניסה לא תקין או שפג תוקפו. חזור ל־/admin ובקש קישור חדש.</div>';
    return true;
  }
}
if(!(await handleCallback())){
  const {data:{session}}=await supabase.auth.getSession();
  if(session?.user){location.replace('/admin.html')}
}
$('#sendBtn').addEventListener('click',async()=>{
  const email=$('#email').value.trim();
  if(!email){showMsg('הכנס כתובת אימייל.',true);return}
  $('#sendBtn').disabled=true;
  const {error}=await supabase.auth.signInWithOtp({email,options:{shouldCreateUser:false,emailRedirectTo:location.origin+'/'}});
  $('#sendBtn').disabled=false;
  if(error){showMsg('שגיאה בשליחת הקישור: '+error.message,true);return}
  showMsg('שלחנו קישור כניסה למייל. פתח את הקישור החדש ביותר פעם אחת.');
});
</script>
</body>
</html>
