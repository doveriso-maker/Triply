<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#073348">
<title>NAVIGAM Preview</title>
<link rel="icon" href="/assets/navigam/symbol.png">
<style>
:root{--deep:#073348;--teal:#087d8b;--cyan:#00cfdf;--ink:#15343d;--muted:#678087;--line:#dcebed;--soft:#f3fafb;--white:#fff;--shadow:0 16px 42px rgba(7,51,72,.12)}
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans",sans-serif;background:linear-gradient(180deg,#eaf9fb 0,#fff 320px);color:var(--ink)}
.app{max-width:760px;margin:auto;min-height:100vh;padding:0 14px 104px}.top{position:sticky;top:0;z-index:20;margin:0 -14px;padding:12px 16px;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.top img{width:105px;height:48px;object-fit:contain}.badge{font-size:11px;font-weight:900;letter-spacing:.08em;color:var(--teal);background:#e9f9fa;padding:8px 10px;border-radius:999px}
.hero{margin:16px 0;border-radius:28px;overflow:hidden;background:linear-gradient(135deg,var(--deep),var(--teal));color:#fff;box-shadow:var(--shadow)}.heroIn{padding:24px}.hero h1{font-size:32px;line-height:1.04;margin:0 0 8px}.hero p{margin:0;color:#daf6f8;line-height:1.5}.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.pill{font-size:12px;background:rgba(255,255,255,.12);padding:8px 10px;border-radius:999px}.previewNote{margin:14px 0;padding:13px 15px;border-radius:16px;background:#fff7df;border:1px solid #f1df9a;font-size:13px;line-height:1.45}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:14px 0}.tab{border:1px solid var(--line);background:#fff;border-radius:14px;padding:11px 7px;font-size:12px;font-weight:800;color:#607981}.tab.active{background:var(--deep);color:#fff;border-color:var(--deep)}
.panel{display:none}.panel.active{display:block}.sectionTitle{display:flex;justify-content:space-between;align-items:end;margin:18px 2px 10px}.sectionTitle h2{margin:0;font-size:21px}.sectionTitle small{color:var(--muted)}
.timeline{display:grid;gap:10px}.event{display:grid;grid-template-columns:60px 1fr;gap:11px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:14px;box-shadow:0 8px 22px rgba(7,51,72,.06)}.time{font-weight:900;color:var(--teal);font-size:15px}.event h3{margin:0 0 5px;font-size:16px}.event p{margin:0;color:var(--muted);font-size:13px;line-height:1.45}.tag{display:inline-block;margin-top:7px;font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.04em;background:#eef9fa;color:var(--teal);padding:5px 7px;border-radius:999px}.links{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.links a{font-size:11px;text-decoration:none;color:#075e6d;background:#edf8f9;border-radius:10px;padding:7px 9px;font-weight:800}
.cards{display:grid;gap:10px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px}.card b{display:block;margin-bottom:5px}.card p{margin:0;color:var(--muted);font-size:13px;line-height:1.45}
.locked{margin-top:18px;padding:22px;border-radius:22px;background:linear-gradient(145deg,#f7fafb,#eef6f7);border:1px dashed #b7d4d8;text-align:center}.locked .lock{font-size:30px}.locked h3{margin:8px 0 6px}.locked p{margin:0;color:var(--muted);font-size:13px;line-height:1.5}
.cta{position:fixed;left:0;right:0;bottom:0;z-index:30;max-width:760px;margin:auto;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:rgba(255,255,255,.96);border-top:1px solid var(--line)}.cta a{display:block;text-align:center;text-decoration:none;background:linear-gradient(135deg,var(--teal),var(--cyan));color:#00343a;font-weight:1000;padding:14px;border-radius:16px}
.loading{position:fixed;inset:0;display:grid;place-items:center;background:#f4fbfc;z-index:50;font-weight:900;color:var(--deep)}.error{max-width:540px;margin:80px auto;padding:24px;text-align:center}.hide{display:none}@media(max-width:430px){.hero h1{font-size:28px}.tabs{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="loading" id="loading">NAVIGAM Preview…</div>
<div class="app" id="app" hidden>
  <header class="top"><img src="/assets/navigam/logo.png" alt="NAVIGAM"><span class="badge">PREVIEW · 24H</span></header>
  <section class="hero"><div class="heroIn"><h1 id="title">NAVIGAM Preview</h1><p id="subtitle"></p><div class="meta"><span class="pill" id="date"></span><span class="pill" id="expiry"></span></div></div></section>
  <div class="previewNote" id="previewNote"></div>
  <nav class="tabs">
    <button class="tab active" data-tab="day" id="tabDay"></button>
    <button class="tab" data-tab="food" id="tabFood"></button>
    <button class="tab" data-tab="shopping" id="tabShopping"></button>
    <button class="tab" data-tab="nightlife" id="tabNightlife"></button>
  </nav>
  <section class="panel active" id="day"><div class="sectionTitle"><h2 id="dayTitle"></h2><small id="daySummary"></small></div><div class="timeline" id="timeline"></div></section>
  <section class="panel" id="food"><div class="sectionTitle"><h2 id="foodTitle"></h2></div><div class="cards" id="foodCards"></div></section>
  <section class="panel" id="shopping"><div class="sectionTitle"><h2 id="shoppingTitle"></h2></div><div class="cards" id="shoppingCards"></div></section>
  <section class="panel" id="nightlife"><div class="sectionTitle"><h2 id="nightlifeTitle"></h2></div><div class="cards" id="nightlifeCards"></div></section>
  <section class="locked"><div class="lock">🔒</div><h3 id="lockedTitle"></h3><p id="lockedText"></p></section>
</div>
<div class="cta" id="cta" hidden><a id="ctaLink" href="#"></a></div>
<script>
const API='https://asnnvwoersrhrgdantll.supabase.co/functions/v1/triply-preview-app';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const copy={
 ru:{subtitle:'Ваш первый день в персональном приложении NAVIGAM',note:'Это персональный Preview вашего путешествия. Здесь открыт только первый день; ссылка действует 24 часа.',day:'День 1',food:'Еда',shopping:'Шопинг',nightlife:'Вечер',lockedTitle:'Остальные дни уже могут быть построены вокруг вас',lockedText:'Если формат вам подходит, мы дополним маршрут на все дни, сохранив всё, что уже узнали о ваших предпочтениях.',cta:'Хочу открыть всю поездку',expires:'Доступ до'},
 ar:{subtitle:'اليوم الأول داخل تطبيق NAVIGAM الشخصي الخاص بك',note:'هذا Preview شخصي لرحلتك. اليوم الأول فقط مفتوح، والرابط صالح لمدة 24 ساعة.',day:'اليوم 1',food:'الطعام',shopping:'التسوق',nightlife:'المساء',lockedTitle:'باقي الأيام يمكن بناؤها بنفس الأسلوب',lockedText:'إذا أعجبك الشكل، نكمل بقية الرحلة باستخدام كل ما عرفناه بالفعل عن تفضيلاتك.',cta:'أريد فتح الرحلة كاملة',expires:'متاح حتى'},
 he:{subtitle:'היום הראשון בתוך אפליקציית NAVIGAM האישית שלך',note:'זהו Preview אישי לטיול שלך. רק היום הראשון פתוח, והקישור זמין ל־24 שעות.',day:'יום 1',food:'אוכל',shopping:'קניות',nightlife:'ערב',lockedTitle:'שאר הימים יכולים להיבנות בדיוק באותו סגנון',lockedText:'אם הפורמט מתאים לך, נשלים את יתר הטיול תוך שימוש בכל מה שכבר למדנו על ההעדפות שלך.',cta:'אני רוצה לפתוח את כל הטיול',expires:'זמין עד'}
};
function card(p){const links=[];if(p.google_maps_url)links.push('<a target="_blank" rel="noopener" href="'+esc(p.google_maps_url)+'">Maps</a>');if(p.website)links.push('<a target="_blank" rel="noopener" href="'+esc(p.website)+'">Website</a>');return '<article class="card"><b>'+esc(p.name||p.title||'')+'</b><p>'+esc(p.description||p.why_match||'')+'</p>'+(links.length?'<div class="links">'+links.join('')+'</div>':'')+'</article>'}
function event(x){const p=x.place||{};const links=[];if(p.google_maps_url)links.push('<a target="_blank" rel="noopener" href="'+esc(p.google_maps_url)+'">Google Maps</a>');if(p.website)links.push('<a target="_blank" rel="noopener" href="'+esc(p.website)+'">Website</a>');return '<article class="event"><div class="time">'+esc((x.start_time||'').slice(0,5)||'—')+'</div><div><h3>'+esc(x.title||'')+'</h3><p>'+esc(x.description||'')+'</p><span class="tag">'+esc(x.item_type||'')+'</span>'+(links.length?'<div class="links">'+links.join('')+'</div>':'')+'</div></article>'}
function group(items,type){return items.filter(x=>String(x.item_type||'').toLowerCase().includes(type)).map(x=>({name:x.place?.name||x.title,description:x.description,google_maps_url:x.place?.google_maps_url,website:x.place?.website}))}
async function load(){
 const token=new URLSearchParams(location.search).get('token');if(!token)throw new Error('missing');
 const r=await fetch(API+'?token='+encodeURIComponent(token),{cache:'no-store'});if(!r.ok)throw new Error('expired');
 const d=await r.json(),lang=d.language||'he',t=copy[lang]||copy.he;document.documentElement.lang=lang;document.documentElement.dir=lang==='ru'?'ltr':'rtl';
 $('#title').textContent=d.trip?.destination||'NAVIGAM Preview';$('#subtitle').textContent=t.subtitle;$('#date').textContent=d.day?.trip_date||'';$('#expiry').textContent=t.expires+' '+new Date(d.expires_at).toLocaleString(lang==='ru'?'ru-RU':lang==='ar'?'ar-IL':'he-IL');
 $('#previewNote').textContent=t.note;$('#tabDay').textContent=t.day;$('#tabFood').textContent=t.food;$('#tabShopping').textContent=t.shopping;$('#tabNightlife').textContent=t.nightlife;
 $('#dayTitle').textContent=d.day?.title||t.day;$('#daySummary').textContent=d.day?.summary||'';const items=d.items||[];$('#timeline').innerHTML=items.map(event).join('');
 const foods=group(items,'food');$('#foodTitle').textContent=t.food;$('#foodCards').innerHTML=(foods.length?foods:[{name:'NAVIGAM',description:t.note}]).map(card).join('');
 const shops=group(items,'shopping');$('#shoppingTitle').textContent=t.shopping;$('#shoppingCards').innerHTML=(shops.length?shops:[{name:'—',description:t.lockedText}]).map(card).join('');
 const nights=group(items,'nightlife');$('#nightlifeTitle').textContent=t.nightlife;$('#nightlifeCards').innerHTML=(nights.length?nights:[{name:'—',description:t.lockedText}]).map(card).join('');
 $('#lockedTitle').textContent=t.lockedTitle;$('#lockedText').textContent=t.lockedText;$('#ctaLink').textContent=t.cta;$('#ctaLink').href='https://wa.me/972557760288?text='+encodeURIComponent(lang==='ru'?'Мне понравился NAVIGAM Preview, хочу продолжить':lang==='ar'?'أعجبني NAVIGAM Preview وأريد المتابعة':'אהבתי את ה-NAVIGAM Preview ואני רוצה להמשיך');
 document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('active',x.id===b.dataset.tab));}));
 $('#loading').classList.add('hide');$('#app').hidden=false;$('#cta').hidden=false;
}
load().catch(()=>{$('#loading').innerHTML='<div class="error"><h2>NAVIGAM Preview</h2><p>This preview link is unavailable or has expired.</p></div>'});
</script>
</body>
</html>
