<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07364b"><title>NAVIGAM Preview</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans",sans-serif;background:#f4fafc;color:#07364b}button,a{font:inherit}.load{min-height:100vh;display:grid;place-items:center;font-weight:800}.app{display:none}.top{height:82px;background:#dff7fb;display:flex;align-items:center;justify-content:space-between;padding:10px 18px;position:sticky;top:0;z-index:5}.logo{width:105px;height:62px;object-fit:contain}.main{max-width:720px;margin:auto;padding:16px 16px 105px}.hero{height:260px;border-radius:28px;overflow:hidden;position:relative;background:linear-gradient(145deg,#075a73,#0bc8dc);box-shadow:0 16px 34px #07364b22}.hero img{width:100%;height:100%;object-fit:cover}.hero .copy{position:absolute;inset:auto 18px 18px;color:#fff;text-shadow:0 2px 8px #0008}.hero h1{font-size:36px;margin:5px 0}.hero small{font-weight:900}.section{margin:20px 2px 10px;font-size:22px}.next,.place,.route{background:#fff;border:1px solid #e1edf2;border-radius:20px;padding:14px;margin:10px 0;box-shadow:0 8px 22px #07364b10}.next b,.place h3{font-size:17px}.muted{color:#6b8190;font-size:13px;line-height:1.55}.places{display:grid;gap:11px}.place{display:grid;grid-template-columns:105px 1fr;gap:12px;align-items:center}.place.noimg{grid-template-columns:1fr}.place img{width:105px;height:105px;object-fit:cover;border-radius:15px}.time{font-weight:900;color:#07849d}.map{display:inline-block;margin-top:9px;text-decoration:none;background:#e6f9fc;color:#075a73;padding:8px 11px;border-radius:12px;font-weight:800;font-size:12px}.bottom{position:fixed;bottom:10px;left:12px;right:12px;max-width:680px;margin:auto;background:#fff;border:1px solid #dcebf0;border-radius:22px;padding:10px;display:flex;justify-content:space-around;box-shadow:0 12px 30px #07364b22}.bottom button{border:0;background:transparent;color:#07364b;font-weight:800;padding:10px}.error{padding:30px;text-align:center}
</style></head><body>
<div id="loading" class="load">NAVIGAM Preview…</div><div id="app" class="app"><header class="top"><button onclick="show('home')">⌂</button><img class="logo" src="/assets/navigam/logo.png"><button onclick="show('places')">⌖</button></header><main class="main"><section id="home"></section><section id="places" style="display:none"></section></main><nav class="bottom"><button onclick="show('home')">الرئيسية</button><button onclick="show('places')">الأماكن</button></nav></div>
<script>
const API='https://asnnvwoersrhrgdantll.supabase.co/functions/v1/triply-preview-app';let D=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function img(x){return x?.place?.preview_image_url||x?.place?.metadata?.preview_image_url||null}
function maps(x){return x?.place?.google_maps_url||'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(x?.place?.name||x?.title||'Istanbul')}
function show(id){document.querySelectorAll('main>section').forEach(x=>x.style.display=x.id===id?'block':'none');scrollTo(0,0)}
function render(){
 const hero=D.trip?.hero_image_url||null,items=D.items||[],first=items[0]||{};
 document.documentElement.lang=D.language||'ar';document.documentElement.dir=(D.language==='ru'?'ltr':'rtl');
 document.getElementById('home').innerHTML=`<div class="hero">${hero?`<img src="${esc(hero)}" onerror="this.remove()">`:''}<div class="copy"><small>NAVIGAM PREVIEW</small><h1>${esc(D.trip.destination)}</h1><div>رحلتك، مصممة لك شخصيًا.</div></div></div><h2 class="section">اليوم الأول</h2><div class="next"><span class="time">${esc((first.start_time||'').slice(0,5))}</span><br><b>${esc(first.title||D.day.title)}</b><p class="muted">${esc(first.description||'')}</p></div><div class="route"><b>${esc(D.day.title||'')}</b><p class="muted">${esc(D.day.summary||'')}</p></div>`;
 document.getElementById('places').innerHTML=`<h2 class="section">الأماكن المقترحة</h2><div class="places">${items.filter(x=>x.place).map(x=>`<article class="place ${img(x)?'':'noimg'}">${img(x)?`<img src="${esc(img(x))}" onerror="this.remove();this.parentElement.classList.add('noimg')">`:''}<div><h3>${esc(x.place.name||x.title)}</h3><p class="muted">${esc(x.description||'')}</p><a class="map" target="_blank" rel="noopener" href="${esc(maps(x))}">Google Maps</a></div></article>`).join('')}</div>`;
 document.getElementById('loading').style.display='none';document.getElementById('app').style.display='block';show('home');
}
async function boot(){try{const code=location.pathname.split('/p/')[1]?.split('/')[0]||new URLSearchParams(location.search).get('code');if(!code)throw Error('missing');const r=await fetch(API+'?code='+encodeURIComponent(code),{cache:'no-store'});if(!r.ok)throw Error(String(r.status));D=await r.json();render()}catch(e){document.getElementById('loading').innerHTML='<div class="error"><img class="logo" src="/assets/navigam/logo.png"><h2>NAVIGAM Preview</h2><p>تعذر تحميل المعاينة. حاول مرة أخرى.</p><button onclick="location.reload()">إعادة المحاولة</button></div>'}}
boot();
</script></body></html>
