<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07364b"><title>NAVIGAM Preview</title>
<style>
:root{--n:#07364b;--c:#0bd3e5;--bg:#f4fafc;--m:#6b8190}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--n)}button,a{font:inherit}.hide{display:none!important}.load{min-height:100vh;display:grid;place-items:center;font-weight:900}.gate{min-height:100vh;background:linear-gradient(155deg,#d7f6fb,#fff);padding:34px 18px;text-align:center}.logo{width:132px;height:78px;object-fit:contain}.cover{max-width:470px;height:48vh;min-height:300px;margin:18px auto;border-radius:32px;overflow:hidden;position:relative;background:linear-gradient(145deg,#075a73,#0bd3e5);box-shadow:0 24px 55px #07364b33}.cover img,.hero img,.thumb img{width:100%;height:100%;object-fit:cover}.shade{position:absolute;inset:0;background:linear-gradient(0deg,#032d43cc,transparent 70%)}.covercopy,.herocopy{position:absolute;z-index:2;inset:auto 20px 22px;color:#fff;text-align:start}.covercopy h1,.herocopy h1{margin:5px 0;font-size:34px}.start{width:min(100%,470px);border:0;border-radius:999px;padding:17px;background:linear-gradient(100deg,var(--c),#75edf4);color:var(--n);font-weight:900;font-size:18px}.top{height:78px;background:#dcf6fb;display:flex;align-items:center;justify-content:space-between;padding:8px 16px;position:sticky;top:0;z-index:8}.top .logo{width:105px;height:60px}.round{width:42px;height:42px;border:0;border-radius:50%;background:#fff9;color:var(--n);font-weight:900}.main{max-width:720px;margin:auto;padding:14px 14px 105px}.screen{display:none}.screen.on{display:block}.hero{height:270px;border-radius:28px;overflow:hidden;position:relative;background:#08738c;box-shadow:0 16px 34px #07364b22}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{padding:6px 9px;border-radius:999px;background:#ffffff30;border:1px solid #ffffff55;font-size:11px}.features{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}.feature{border:1px solid #e1edf2;background:#fff;border-radius:19px;padding:15px 7px;color:var(--n);font-weight:850;box-shadow:0 8px 22px #07364b10}.feature b{display:block;font-size:23px;margin-bottom:6px}.h2{font-size:21px;margin:20px 2px 9px}.card{background:#fff;border:1px solid #e1edf2;border-radius:20px;padding:14px;margin:10px 0;box-shadow:0 8px 22px #07364b0d}.muted{color:var(--m);font-size:12px;line-height:1.55}.time{font-weight:900;color:#07849d}.place{display:grid;grid-template-columns:100px 1fr;gap:12px;align-items:center}.place.noimg{grid-template-columns:1fr}.thumb{width:100px;height:100px;border-radius:15px;overflow:hidden}.map{display:inline-block;margin-top:8px;text-decoration:none;background:#e5f9fc;color:#075d73;border-radius:11px;padding:7px 10px;font-weight:850;font-size:11px}.tool{background:linear-gradient(145deg,#07364b,#0a6881);color:#fff}.locked{text-align:center;background:#fff9e9;border:1px dashed #e5d49c}.bottom{position:fixed;z-index:20;bottom:9px;left:10px;right:10px;max-width:650px;margin:auto;height:72px;background:#fff;border:1px solid #dcebf0;border-radius:24px;display:grid;grid-template-columns:1fr 1fr 1.15fr 1fr 1fr;align-items:center;box-shadow:0 12px 32px #07364b25}.nav{border:0;background:transparent;color:var(--n);font-size:10px;font-weight:850}.avia{position:relative;top:-10px}.avia b{display:grid;place-items:center;margin:auto;width:54px;height:54px;border-radius:50%;background:#fff;border:3px solid #bff4f7;font-size:20px}.error{text-align:center;padding:30px}
</style></head><body>
<div id="load" class="load">NAVIGAM Preview…</div>
<section id="gate" class="gate hide"><img class="logo" src="/assets/navigam/logo.png"><div class="cover"><img id="splashImg"><div class="shade"></div><div class="covercopy"><small>NAVIGAM PREVIEW</small><h1 id="gateDest"></h1><div id="gateSub"></div></div></div><button id="start" class="start"></button></section>
<section id="live" class="hide"><header class="top"><button class="round" onclick="go('home')">⌂</button><img class="logo" src="/assets/navigam/logo.png"><button class="round" onclick="go('tools')">✦</button></header><main class="main"><section id="home" class="screen"></section><section id="trip" class="screen"></section><section id="places" class="screen"></section><section id="tools" class="screen"></section><section id="info" class="screen"></section></main><nav class="bottom"><button class="nav" data-k="home" onclick="go('home')"></button><button class="nav" data-k="trip" onclick="go('trip')"></button><button class="nav avia" onclick="go('tools')"><b>✦</b>Avia</button><button class="nav" data-k="places" onclick="go('places')"></button><button class="nav" data-k="info" onclick="go('info')"></button></nav></section>
<script>
var API='https://asnnvwoersrhrgdantll.supabase.co/functions/v1/triply-preview-app',D,L,T;
var I={ar:{open:'فتح الـ Preview',home:'الرئيسية',trip:'المسار',places:'الأماكن',info:'مفيد',tag:'رحلتك، مصممة لك شخصيًا',day:'اليوم الأول',translate:'ترجمة حية',weather:'الطقس',map:'Google Maps',locked:'بقية الرحلة متاحة في النسخة الكاملة',tools:'أدوات السفر',transdesc:'ترجمة حية ثنائية الاتجاه للصوت والنص حسب لغتك ولغة الوجهة.',weatherdesc:'الطقس المتوقع للوجهة خلال تواريخ الرحلة، ويتحدث كلما اقترب موعد السفر.',avia:'مساعدة شخصية للمسار والأماكن والتغييرات أثناء الرحلة.'},he:{open:'פתיחת ה-Preview',home:'בית',trip:'מסלול',places:'מקומות',info:'שימושי',tag:'הטיול שלך. מותאם אישית.',day:'יום ראשון',translate:'תרגום חי',weather:'מזג אוויר',map:'Google Maps',locked:'שאר הטיול זמין בגרסה המלאה',tools:'כלים לטיול',transdesc:'תרגום חי דו-כיווני של דיבור וטקסט לפי שפת המשתמש ושפת היעד.',weatherdesc:'מזג האוויר הצפוי ביעד לתאריכי הנסיעה, ומתעדכן ככל שמתקרבים לטיול.',avia:'ליווי אישי למסלול, למקומות ולשינויים בזמן הטיול.'},en:{open:'Open Preview',home:'Home',trip:'Trip',places:'Places',info:'Useful',tag:'Your trip. Personally navigated.',day:'Day 1',translate:'Live Translate',weather:'Weather',map:'Google Maps',locked:'The rest of the trip is available in the full version',tools:'Travel tools',transdesc:'Live two-way voice and text translation based on your language and destination.',weatherdesc:'Expected destination weather for your travel dates, updated as the trip approaches.',avia:'Personal help with your route, places and changes during the trip.'},ru:{open:'Открыть Preview',home:'Главная',trip:'Маршрут',places:'Места',info:'Полезное',tag:'Ваше путешествие. Персонально.',day:'День 1',translate:'Живой перевод',weather:'Погода',map:'Google Maps',locked:'Остальная поездка доступна в полной версии',tools:'Инструменты',transdesc:'Двусторонний перевод речи и текста с учетом языка пользователя и страны.',weatherdesc:'Прогноз погоды на даты поездки с обновлением по мере приближения путешествия.',avia:'Персональная помощь с маршрутом, местами и изменениями в поездке.'}};
function e(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function im(x){return x&&x.place&&(x.place.preview_image_url||(x.place.metadata&&x.place.metadata.preview_image_url))}function mp(x){return x&&x.place&&x.place.google_maps_url||'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(x&&x.place?x.place.name:x.title)}function go(id){document.querySelectorAll('.screen').forEach(function(x){x.classList.toggle('on',x.id===id)});scrollTo(0,0)}function enter(){document.getElementById('gate').classList.add('hide');document.getElementById('live').classList.remove('hide');go('home')}
function render(){L=D.language||'en';T=I[L]||I.en;document.documentElement.lang=L;document.documentElement.dir=(L==='ar'||L==='he')?'rtl':'ltr';document.querySelectorAll('[data-k]').forEach(function(x){x.textContent=T[x.dataset.k]});document.getElementById('start').textContent=T.open;document.getElementById('start').onclick=enter;document.getElementById('gateDest').textContent=D.trip.destination;document.getElementById('gateSub').textContent=T.tag;var hero=D.trip.hero_image_url||'',splash=D.trip.splash_image_url||hero,items=D.items||[];if(splash){document.getElementById('splashImg').src=splash;document.getElementById('splashImg').onerror=function(){this.style.display='none'}}else document.getElementById('splashImg').style.display='none';
var heroHtml='<div class="hero">'+(hero?'<img src="'+e(hero)+'" onerror="this.remove()">':'')+'<div class="shade"></div><div class="herocopy"><small>NAVIGAM PREVIEW</small><h1>'+e(D.trip.destination)+'</h1><div>'+e(T.tag)+'</div></div></div>';
document.getElementById('home').innerHTML=heroHtml+'<div class="features"><button class="feature" onclick="go(&quot;trip&quot;)"><b>≡</b>'+e(T.trip)+'</button><button class="feature" onclick="go(&quot;places&quot;)"><b>⌖</b>'+e(T.places)+'</button><button class="feature" onclick="go(&quot;tools&quot;)"><b>🌐</b>'+e(T.translate)+'</button><button class="feature" onclick="go(&quot;tools&quot;)"><b>🌤️</b>'+e(T.weather)+'</button></div><div class="card"><b>'+e(D.day.title||T.day)+'</b><p class="muted">'+e(D.day.summary||'')+'</p></div><div class="card locked">🔒 '+e(T.locked)+'</div>';
document.getElementById('trip').innerHTML='<h2 class="h2">'+e(D.day.title||T.day)+'</h2>'+items.map(function(x){return '<div class="card"><span class="time">'+e((x.start_time||'').slice(0,5))+'</span><h3>'+e(x.title)+'</h3><p class="muted">'+e(x.description||'')+'</p>'+(x.place?'<a class="map" target="_blank" rel="noopener" href="'+e(mp(x))+'">'+e(T.map)+'</a>':'')+'</div>'}).join('')+'<div class="card locked">🔒 '+e(T.locked)+'</div>';
document.getElementById('places').innerHTML='<h2 class="h2">'+e(T.places)+'</h2>'+items.filter(function(x){return x.place}).map(function(x){var u=im(x);return '<div class="card place '+(u?'':'noimg')+'">'+(u?'<div class="thumb"><img src="'+e(u)+'" onerror="this.closest(&quot;.place&quot;).classList.add(&quot;noimg&quot;);this.parentElement.remove()"></div>':'')+'<div><h3>'+e(x.place.name||x.title)+'</h3><p class="muted">'+e(x.description||'')+'</p><a class="map" target="_blank" rel="noopener" href="'+e(mp(x))+'">'+e(T.map)+'</a></div></div>'}).join('');
document.getElementById('tools').innerHTML='<h2 class="h2">'+e(T.tools)+'</h2><div class="card tool"><h3>🌐 NAVIGAM Translate</h3><p>'+e(T.transdesc)+'</p></div><div class="card tool"><h3>🌤️ '+e(T.weather)+'</h3><p>'+e(T.weatherdesc)+'</p></div><div class="card"><h3>✦ Avia</h3><p class="muted">'+e(T.avia)+'</p></div>';
document.getElementById('info').innerHTML='<h2 class="h2">'+e(T.info)+'</h2><div class="card"><b>NAVIGAM Preview</b><p class="muted">'+e(T.tag)+'</p></div><div class="card locked">🔒 '+e(T.locked)+'</div>';
document.getElementById('load').classList.add('hide');document.getElementById('gate').classList.remove('hide')}
async function boot(){try{var code=location.pathname.split('/p/')[1];if(code)code=code.split('/')[0];if(!code)code=new URLSearchParams(location.search).get('code');var r=await fetch(API+'?code='+encodeURIComponent(code),{cache:'no-store'});if(!r.ok)throw Error(r.status);D=await r.json();render()}catch(err){document.getElementById('load').innerHTML='<div class="error"><img class="logo" src="/assets/navigam/logo.png"><h2>NAVIGAM Preview</h2><p>Preview unavailable</p><button class="start" onclick="location.reload()">Retry</button></div>'}}boot();
</script></body></html>
