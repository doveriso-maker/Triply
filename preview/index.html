<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NAVIGAM Preview</title>
<style>
:root{--navy:#063e5a;--cyan:#20d5e5;--bg:#eef8fb;--muted:#6b7f88;--line:#d9e9ee}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(#dff5fb 0,#fff 32%);color:var(--navy)}
.shell{max-width:430px;margin:auto;min-height:100vh;background:#fff;box-shadow:0 0 30px #063e5a14;padding-bottom:92px}
header{height:72px;display:flex;align-items:center;justify-content:space-between;padding:12px 18px;background:linear-gradient(#dcf5fb,#fff)}
.brand{font-weight:900;font-size:24px;letter-spacing:1px}.brand b{color:var(--cyan)}.icon{width:42px;height:42px;border:0;background:#fff;border-radius:14px;box-shadow:0 4px 16px #063e5a18;font-size:20px;color:var(--navy)}
.hero{margin:0 14px;height:235px;border-radius:26px;overflow:hidden;position:relative;background:#0c5c79}
.hero img{width:100%;height:100%;object-fit:cover}.shade{position:absolute;inset:0;background:linear-gradient(transparent 30%,#052f47d9)}
.heroText{position:absolute;bottom:18px;right:18px;left:18px;color:#fff}.heroText small{font-weight:700}.heroText h1{margin:5px 0;font-size:29px}.heroText p{margin:0;font-size:14px}
.intro{padding:18px 18px 6px}.intro h2{margin:0 0 7px;font-size:22px}.intro p{margin:0;color:var(--muted);line-height:1.55}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:14px}.actions button{border:0;background:#f4fbfd;border-radius:18px;padding:12px 3px;color:var(--navy);font-weight:700}.actions i{display:block;font-style:normal;font-size:24px;margin-bottom:6px;color:#0797b7}
.day{margin:4px 14px 16px;border:1px solid var(--line);border-radius:24px;overflow:hidden;background:#fff;box-shadow:0 10px 26px #063e5a0d}.dayTitle{padding:16px 18px;font-size:19px;font-weight:900;background:#f4fbfd}
.event{display:grid;grid-template-columns:56px 18px 1fr;gap:8px;padding:14px 14px 14px 8px;position:relative}.event:not(:last-child){border-bottom:1px solid #edf3f5}.time{font-size:13px;font-weight:800;text-align:left}.rail{position:relative}.rail:after{content:"";position:absolute;top:14px;bottom:-28px;right:7px;width:2px;background:#bceaf1}.event:last-child .rail:after{display:none}.dot{width:16px;height:16px;border-radius:50%;background:var(--cyan);border:4px solid #dffbfe;position:relative;z-index:2}.txt b{display:block;font-size:15px;margin-bottom:5px}.txt span{display:block;color:var(--muted);font-size:13px;line-height:1.45}.map{display:inline-block;margin-top:8px;text-decoration:none;color:#078aa7;font-weight:800;font-size:12px}
.lock{margin:0 14px 18px;padding:16px;border-radius:20px;background:#063e5a;color:#fff;line-height:1.5}.lock b{color:#4be8f2}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(430px,100%);height:76px;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;z-index:5}.navitem{text-align:center;font-size:11px;color:#6c8089}.navitem strong{display:block;font-size:21px;color:#0b617d;margin-bottom:3px}.avia{width:58px;height:58px;border-radius:50%;background:var(--cyan);margin-top:-34px;border:5px solid #fff;display:flex;align-items:center;justify-content:center;font-size:25px;color:#063e5a;box-shadow:0 6px 18px #063e5a26}
.err{padding:40px 24px;text-align:center;line-height:1.6}.toptools{display:flex;gap:8px;overflow:auto;padding:10px 14px}.toptools button{min-width:86px;border:1px solid var(--line);background:#fff;border-radius:15px;padding:9px;color:var(--navy);font-weight:800}.navitem{cursor:pointer}.navitem:active{transform:scale(.96)}
</style></head>
<body><div class="shell" id="root"><div class="err">NAVIGAM…</div></div>
<script>
(function(){
var API='https://asnnvwoersrhrgdantll.supabase.co/functions/v1/triply-preview-app';
function esc(s){var d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML}
function code(){var m=location.pathname.match(/\/p\/([^/?#]+)/);return m?m[1]:''}
function maps(x){var p=x.place||{};return p.google_maps_url||('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(p.name||x.title||''))}
function render(D){
 var trip=D.trip||{},day=D.day||{},items=D.items||[],prefs=trip.preferences||{},hero=prefs.hero_image_url||prefs.hero||prefs.splash_image_url||prefs.splash||'https://images.unsplash.com/photo-1524231757912-21f4fe3a7200?auto=format&fit=crop&w=1200&q=85';
 var ev=''; for(var i=0;i<items.length;i++){var x=items[i];ev+='<div class="event"><div class="time">'+esc(x.start_time||x.time||'')+'</div><div class="rail"><div class="dot"></div></div><div class="txt"><b>'+esc(x.title||'')+'</b><span>'+esc(x.description||'')+'</span>'+(x.place?'<a class="map" target="_blank" href="'+esc(maps(x))+'">فتح في الخرائط ←</a>':'')+'</div></div>'}
 document.documentElement.dir=(D.language==='he'?'rtl':D.language==='ar'?'rtl':'ltr');
 document.getElementById('root').innerHTML='<header><button class="icon">⌂</button><div class="brand">NAVI<b>GAM</b></div><button class="icon">☰</button></header><div class="toptools"><button>文<br>ترجمة</button><button>☀<br>الطقس</button><button>ⓘ<br>معلومات</button><button>✓<br>قائمة</button></div><section class="hero"><img src="'+esc(hero)+'" alt=""><div class="shade"></div><div class="heroText"><small>NAVIGAM PREVIEW</small><h1>'+esc(trip.destination||'Istanbul')+'</h1><p>رحلتك، مخططة خصيصًا لك</p></div></section><section class="intro"><h2>اليوم الأول שלך מתחיל כאן</h2><p>هذه معاينة حقيقية ليوم واحد. التطبيق الكامل يرافق الرحلة كلها — المسار، الأماكن، الملاحة، الترجمة والمساعدة من Avia.</p></section><div class="actions"><button><i>⌁</i>المسار</button><button><i>⌖</i>الأماكن</button><button><i>文</i>ترجمة</button><button><i>☀</i>الطقس</button></div><section class="day"><div class="dayTitle">'+esc(day.title||'اليوم 1')+'</div>'+ev+'</section><div class="lock">🔒 هذه معاينة لليوم الأول فقط. <b>NAVIGAM الكامل</b> يفتح بقية الأيام، Avia، الخريطة والملاحة، الأماكن المحفوظة، الترجمة، الطقس، المعلومات المهمة، قائمة السفر، العمل دون اتصال، الفنادق والدعم — كلها داخل التطبيق.</div><nav><div class="navitem"><strong>⌂</strong>الرئيسية</div><div class="navitem"><strong>🗓</strong>مساري</div><div class="avia">A</div><div class="navitem"><strong>⌖</strong>الخريطة</div><div class="navitem"><strong>♡</strong>المحفوظة</div></nav>';
}
function fail(){document.getElementById('root').innerHTML='<div class="err"><div class="brand">NAVI<b>GAM</b></div><h2>تعذر تحميل المعاينة</h2><p>حاول فتح الرابط مرة أخرى.</p></div>'}
var c=code();if(!c){fail();return}fetch(API+'?code='+encodeURIComponent(c),{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('api');return r.json()}).then(render).catch(fail);
})();
</script></body></html>
