<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07364b"><title>NAVIGAM Preview</title>
<style>
:root{--n:#073b57;--t:#00afc8;--bg:#f3f8fa;--m:#71868e;--l:#e3edf0}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:#143b50;letter-spacing:-.1px}button,a{font:inherit}.hide{display:none!important}.load{min-height:100vh;display:grid;place-items:center;font-weight:900}.gate{min-height:100vh;background:radial-gradient(circle at 50% 0,#bff5f8 0,#eefcfd 34%,#fff 72%);padding:26px 18px 40px;text-align:center}.logo{width:132px;height:78px;object-fit:contain}.cover{max-width:470px;height:52vh;min-height:330px;margin:12px auto 18px;border-radius:34px;overflow:hidden;position:relative;background:linear-gradient(145deg,#075a73,#0bd3e5);box-shadow:0 28px 65px #07364b30;border:1px solid #fff}.cover img,.hero img,.thumb img{width:100%;height:100%;object-fit:cover}.shade{position:absolute;inset:0;background:linear-gradient(0deg,#032d43cc,transparent 70%)}.covercopy,.herocopy{position:absolute;z-index:2;inset:auto 20px 22px;color:#fff;text-align:start}.covercopy h1,.herocopy h1{margin:5px 0;font-size:34px}.start{width:min(100%,470px);border:0;border-radius:18px;padding:17px;background:linear-gradient(110deg,#13cfe0,#8ceef4);color:var(--n);font-weight:900;font-size:17px;box-shadow:0 12px 28px #0bcbd433}.top{height:74px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:8px 14px;position:sticky;top:0;z-index:8;border-bottom:1px solid #e3edf0}.top .logo{width:105px;height:60px}.round{width:42px;height:42px;border:0;border-radius:50%;background:#fff9;color:var(--n);font-weight:900}.main{max-width:720px;margin:auto;padding:10px 14px 112px}.screen{display:none}.screen.on{display:block}.hero{height:245px;border-radius:26px;overflow:hidden;position:relative;background:linear-gradient(135deg,#073b57,#0d7085);box-shadow:0 14px 30px #073b5720;margin-bottom:14px}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{padding:6px 9px;border-radius:999px;background:#ffffff30;border:1px solid #ffffff55;font-size:11px}.features{display:flex;gap:8px;overflow:auto;padding:2px 0 12px;margin:0}.feature{border:1px solid #dbe8eb;background:#fff;border-radius:999px;padding:11px 12px;color:#45606d;font-weight:900;box-shadow:none}.feature b{display:inline;font-size:16px;margin-inline-end:5px}.h2{font-size:21px;margin:20px 2px 9px}.card{background:#fff;border:1px solid #e3edf0;border-radius:24px;padding:16px;margin:0 0 13px;box-shadow:0 9px 24px #073b5712}.muted{color:var(--m);font-size:12px;line-height:1.55}.time{font-weight:1000;color:#0d6983}.place{display:grid;grid-template-columns:100px 1fr;gap:12px;align-items:center}.place.noimg{grid-template-columns:1fr}.thumb{width:100px;height:108px;border-radius:18px;overflow:hidden;box-shadow:0 8px 18px #07364b1c}.map{display:inline-block;margin-top:8px;text-decoration:none;background:#edf8fa;color:#0b6078;border-radius:999px;padding:7px 10px;font-weight:900;font-size:10px}.routeMap{display:block;text-align:center;margin:12px 0 16px;padding:13px;border-radius:18px;background:linear-gradient(135deg,var(--n),var(--c));color:#fff;font-weight:900;text-decoration:none;box-shadow:0 10px 24px #073b5720}.tool{background:linear-gradient(135deg,#073b57,#0d7085);color:#fff;border:0;box-shadow:0 14px 30px #073b5720}.demo{margin-top:12px;padding:12px;border-radius:15px;background:#ffffff12;border:1px solid #ffffff25}.demo textarea{width:100%;min-height:70px;border:0;border-radius:12px;padding:10px;resize:none}.demo button{margin-top:8px;border:0;border-radius:12px;padding:10px 13px;background:#bff7fb;color:#07364b;font-weight:900}.langpair{font-size:12px;font-weight:900;opacity:.9}.weatherBox{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.weatherIcon{font-size:38px}.future{display:inline-block;padding:5px 8px;border-radius:999px;background:#ffffff22;font-size:11px;font-weight:900}.locked{text-align:center;background:#fff9e9;border:1px dashed #e5d49c}.bottom{position:fixed;z-index:20;bottom:max(8px,env(safe-area-inset-bottom));left:10px;right:10px;max-width:740px;margin:auto;height:66px;background:#ffffffee;border:1px solid #dce8eb;border-radius:22px;display:grid;grid-template-columns:1fr 1fr 1.15fr 1fr 1fr;box-shadow:0 14px 36px #073b5728;padding:5px}.nav{border:0;background:transparent;border-radius:16px;color:#728790;font-weight:800;font-size:10px}.avia{position:relative;top:-10px}.avia b{display:grid;place-items:center;margin:auto;width:54px;height:54px;border-radius:50%;background:#eff9fb;border:3px solid #cceff3;color:var(--c);font-size:20px;box-shadow:0 8px 20px #073b5718}.error{text-align:center;padding:30px}
</style></head><body>

<section id="live" class="hide"><header class="top"><button class="round" onclick="go('home')">⌂</button><img class="logo" src="/assets/navigam/logo.png"><button class="round" onclick="go('tools')">✦</button></header><main class="main"><section id="home" class="screen"></section><section id="trip" class="screen"></section><section id="places" class="screen"></section><section id="tools" class="screen"></section><section id="info" class="screen"></section></main><nav class="bottom"><button class="nav" data-k="home" onclick="go('home')"></button><button class="nav" data-k="trip" onclick="go('trip')"></button><button class="nav avia" onclick="go('tools')"><b>✦</b>Avia</button><button class="nav" data-k="places" onclick="go('places')"></button><button class="nav" data-k="info" onclick="go('info')"></button></nav></section>
<script>
var API='https://asnnvwoersrhrgdantll.supabase.co/functions/v1/triply-preview-app',D,L,T;
var I={ar:{open:'فتح الـ Preview',home:'الرئيسية',trip:'المسار',places:'الأماكن',info:'مفيد',tag:'رحلتك، مصممة لك شخصيًا',day:'اليوم الأول',translate:'ترجمة حية',weather:'الطقس',map:'Google Maps',locked:'بقية الرحلة متاحة في النسخة الكاملة',tools:'أدوات السفر',transdesc:'ترجمة حية ثنائية الاتجاه للصوت والنص حسب لغتك ولغة الوجهة.',weatherdesc:'الطقس المتوقع للوجهة خلال تواريخ الرحلة، ويتحدث كلما اقترب موعد السفر.',avia:'مساعدة شخصية للمسار والأماكن والتغييرات أثناء الرحلة.'},he:{open:'פתיחת ה-Preview',home:'בית',trip:'מסלול',places:'מקומות',info:'שימושי',tag:'הטיול שלך. מותאם אישית.',day:'יום ראשון',translate:'תרגום חי',weather:'מזג אוויר',map:'Google Maps',locked:'שאר הטיול זמין בגרסה המלאה',tools:'כלים לטיול',transdesc:'תרגום חי דו-כיווני של דיבור וטקסט לפי שפת המשתמש ושפת היעד.',weatherdesc:'מזג האוויר הצפוי ביעד לתאריכי הנסיעה, ומתעדכן ככל שמתקרבים לטיול.',avia:'ליווי אישי למסלול, למקומות ולשינויים בזמן הטיול.'},en:{open:'Open Preview',home:'Home',trip:'Trip',places:'Places',info:'Useful',tag:'Your trip. Personally navigated.',day:'Day 1',translate:'Live Translate',weather:'Weather',map:'Google Maps',locked:'The rest of the trip is available in the full version',tools:'Travel tools',transdesc:'Live two-way voice and text translation based on your language and destination.',weatherdesc:'Expected destination weather for your travel dates, updated as the trip approaches.',avia:'Personal help with your route, places and changes during the trip.'},ru:{open:'Открыть Preview',home:'Главная',trip:'Маршрут',places:'Места',info:'Полезное',tag:'Ваше путешествие. Персонально.',day:'День 1',translate:'Живой перевод',weather:'Погода',map:'Google Maps',locked:'Остальная поездка доступна в полной версии',tools:'Инструменты',transdesc:'Двусторонний перевод речи и текста с учетом языка пользователя и страны.',weatherdesc:'Прогноз погоды на даты поездки с обновлением по мере приближения путешествия.',avia:'Персональная помощь с маршрутом, местами и изменениями в поездке.'}};
function e(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function im(x){return x&&x.place&&(x.place.preview_image_url||(x.place.metadata&&x.place.metadata.preview_image_url))}function mp(x){return x&&x.place&&x.place.google_maps_url||'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(x&&x.place?x.place.name:x.title)}function routeMap(items){var p=items.filter(function(x){return x.place}).map(function(x){return x.place.name||x.title});if(!p.length)return '#';if(p.length===1)return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(p[0]);var origin=p[0],dest=p[p.length-1],way=p.slice(1,-1);return 'https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(origin)+'&destination='+encodeURIComponent(dest)+(way.length?'&waypoints='+encodeURIComponent(way.join('|')):'')+'&travelmode=walking'}function go(id){document.querySelectorAll('.screen').forEach(function(x){x.classList.toggle('on',x.id===id)});scrollTo(0,0)}function enter(){document.getElementById('gate').classList.add('hide');document.getElementById('live').classList.remove('hide');go('home')}
function render(){L=D.language||'en';T=I[L]||I.en;document.documentElement.lang=L;document.documentElement.dir=(L==='ar'||L==='he')?'rtl':'ltr';document.querySelectorAll('[data-k]').forEach(function(x){x.textContent=T[x.dataset.k]});document.getElementById('start').textContent=T.open;document.getElementById('start').onclick=enter;document.getElementById('gateDest').textContent=D.trip.destination;document.getElementById('gateSub').textContent=T.tag;var hero=D.trip.hero_image_url||'',splash=D.trip.splash_image_url||hero,items=D.items||[];if(splash){document.getElementById('splashImg').src=splash;document.getElementById('splashImg').onerror=function(){this.style.display='none'}}else document.getElementById('splashImg').style.display='none';
var heroHtml='<div class="hero">'+(hero?'<img src="'+e(hero)+'" onerror="this.remove()">':'')+'<div class="shade"></div><div class="herocopy"><small>NAVIGAM PREVIEW</small><h1>'+e(D.trip.destination)+'</h1><div>'+e(T.tag)+'</div></div></div>';
document.getElementById('home').innerHTML=heroHtml+'<div class="features"><button class="feature" onclick="go(&quot;trip&quot;)"><b>≡</b>'+e(T.trip)+'</button><button class="feature" onclick="go(&quot;places&quot;)"><b>⌖</b>'+e(T.places)+'</button><button class="feature" onclick="go(&quot;tools&quot;)"><b>🌐</b>'+e(T.translate)+'</button><button class="feature" onclick="go(&quot;tools&quot;)"><b>🌤️</b>'+e(T.weather)+'</button></div><div class="card"><b>'+e(D.day.title||T.day)+'</b><p class="muted">'+e(D.day.summary||'')+'</p></div><div class="card locked">🔒 '+e(T.locked)+'</div>';
document.getElementById('trip').innerHTML='<h2 class="h2">'+e(D.day.title||T.day)+'</h2><a class="routeMap" target="_blank" rel="noopener" href="'+e(routeMap(items))+'">🗺️ '+e(L==='he'?'כל נקודות היום במפה אחת':L==='ar'?'كل نقاط اليوم على خريطة واحدة':L==='ru'?'Все точки дня на одной карте':'All day points on one map')+'</a>'+items.map(function(x){return '<div class="card"><span class="time">'+e((x.start_time||'').slice(0,5))+'</span><h3>'+e(x.title)+'</h3><p class="muted">'+e(x.description||'')+'</p>'+(x.place?'<a class="map" target="_blank" rel="noopener" href="'+e(mp(x))+'">'+e(T.map)+'</a>':'')+'</div>'}).join('')+'<div class="card locked">🔒 '+e(T.locked)+'</div>';
document.getElementById('places').innerHTML='<h2 class="h2">'+e(T.places)+'</h2>'+items.filter(function(x){return x.place}).map(function(x){var u=im(x);return '<div class="card place '+(u?'':'noimg')+'">'+(u?'<div class="thumb"><img src="'+e(u)+'" onerror="this.closest(&quot;.place&quot;).classList.add(&quot;noimg&quot;);this.parentElement.remove()"></div>':'')+'<div><h3>'+e(x.place.name||x.title)+'</h3><p class="muted">'+e(x.description||'')+'</p><a class="map" target="_blank" rel="noopener" href="'+e(mp(x))+'">'+e(T.map)+'</a></div></div>'}).join('');
var pair=L==='ar'?'العربية ⇄ لغة الوجهة':L==='he'?'עברית ⇄ שפת היעד':L==='ru'?'Русский ⇄ язык страны':'Your language ⇄ destination language';var future=L==='ar'?'توقعات مستقبلية':L==='he'?'תחזית עתידית':L==='ru'?'Будущий прогноз':'Future forecast';var hint=L==='ar'?'اكتب أو تحدث هنا…':L==='he'?'הקלד או דבר כאן…':L==='ru'?'Введите или говорите…':'Type or speak here…';var demo=L==='ar'?'عرض الترجمة':L==='he'?'הצג תרגום':L==='ru'?'Показать перевод':'Show translation';document.getElementById('tools').innerHTML='<h2 class="h2">'+e(T.tools)+'</h2><div class="card tool"><h3>🌐 NAVIGAM Translate</h3><div class="langpair">'+e(pair)+'</div><p>'+e(T.transdesc)+'</p><div class="demo"><textarea placeholder="'+e(hint)+'"></textarea><button type="button" onclick="translationDemo(this)">🎙️ '+e(demo)+'</button><div class="muted" style="color:#d8f8fb;margin-top:8px">Preview demo · text & voice interface</div></div></div><div class="card tool"><div class="weatherBox"><div><h3>🌤️ '+e(T.weather)+'</h3><span class="future">'+e(future)+'</span></div><div class="weatherIcon">☀️</div></div><p>'+e(T.weatherdesc)+'</p><div class="demo">'+e(L==='he'?'כשהטיול מחוץ לטווח התחזית המדויקת, NAVIGAM מציג שזה מודול עתידי ומעדכן אוטומטית כשנכנסים לטווח.':L==='ar'?'عندما تكون الرحلة خارج نطاق التوقع الدقيق، يعرض NAVIGAM الوحدة كتوقع مستقبلي ويتم تحديثها تلقائياً عند دخول نطاق التنبؤ.':L==='ru'?'Если поездка еще вне точного прогноза, NAVIGAM показывает будущий модуль и обновляет его при входе в диапазон прогноза.':'When the trip is outside the reliable forecast window, NAVIGAM shows a future-weather module and updates it once the dates enter forecast range.')+'</div></div><div class="card"><h3>✦ Avia</h3><p class="muted">'+e(T.avia)+'</p></div>';
document.getElementById('info').innerHTML='<h2 class="h2">'+e(T.info)+'</h2><div class="card"><b>NAVIGAM Preview</b><p class="muted">'+e(T.tag)+'</p></div><div class="card locked">🔒 '+e(T.locked)+'</div>';
document.getElementById('load').classList.add('hide');document.getElementById('gate').classList.remove('hide')}
function translationDemo(b){var box=b.parentElement,ta=box.querySelector('textarea'),v=ta.value.trim();var out=box.querySelector('.translationOut');if(!out){out=document.createElement('div');out.className='translationOut';out.style.marginTop='10px';box.appendChild(out)}out.textContent=v?(L==='he'?'תרגום Preview: '+v:L==='ar'?'معاينة الترجمة: '+v:L==='ru'?'Демо перевода: '+v:'Translation preview: '+v):(L==='he'?'בגרסה המלאה ניתן לדבר או להקליד ולקבל תרגום דו־כיווני בזמן אמת.':L==='ar'?'في النسخة الكاملة يمكنك التحدث أو الكتابة والحصول على ترجمة ثنائية الاتجاه مباشرة.':L==='ru'?'В полной версии доступны голосовой и текстовый двусторонний перевод в реальном времени.':'The full version supports live two-way voice and text translation.')}async function boot(){try{var code=location.pathname.split('/p/')[1];if(code)code=code.split('/')[0];if(!code)code=new URLSearchParams(location.search).get('code');var r=await fetch(API+'?code='+encodeURIComponent(code),{cache:'no-store'});if(!r.ok)throw Error(r.status);D=await r.json();render()}catch(err){document.getElementById('load').innerHTML='<div class="error"><img class="logo" src="/assets/navigam/logo.png"><h2>NAVIGAM Preview</h2><p>Preview unavailable</p><button class="start" onclick="location.reload()">Retry</button></div>'}}boot();
</script></body></html>
