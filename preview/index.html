<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#006b88"><title>NAVIGAM Preview</title>
<style>
:root{--deep:#063e5a;--blue:#087b9b;--cyan:#21d5e5;--bg:#eef8fb;--ink:#083b52;--muted:#6b7f88;--line:#d8e8ed}
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans Arabic",sans-serif;background:linear-gradient(#dff3fa 0,#fff 250px);color:var(--ink)}button,a{font:inherit}.hide{display:none!important}.load{min-height:100vh;display:grid;place-items:center;font-weight:900}.logo{object-fit:contain}
.gate{min-height:100vh;padding:18px 16px 28px;text-align:center;background:linear-gradient(#dff3fa,#fff 55%)}.gate>.logo{width:150px;height:95px}.cover{max-width:430px;height:65vh;min-height:430px;margin:4px auto 14px;border-radius:27px;overflow:hidden;position:relative;background:var(--deep)}.cover img,.hero img,.photo img{width:100%;height:100%;object-fit:cover}.shade{position:absolute;inset:0;background:linear-gradient(0deg,#042f48e8 0,transparent 58%)}.copy{position:absolute;inset:auto 18px 24px;z-index:2;color:#fff;text-align:start}.copy small{font-weight:900;letter-spacing:1px}.copy h1{font-size:36px;margin:6px 0}.start{width:min(100%,430px);border:0;border-radius:15px;padding:16px;background:var(--cyan);color:var(--deep);font-size:17px;font-weight:1000}
.app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:78px}.top{height:75px;padding:7px 14px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(#c9edf8,#f8fdff);position:sticky;top:0;z-index:10}.top .logo{width:112px;height:60px}.iconbtn{width:40px;height:40px;border:0;border-radius:50%;background:#fff;color:var(--blue);font-weight:1000}.main{padding:12px 14px}.screen{display:none}.screen.on{display:block}
.hero{height:205px;border-radius:20px;overflow:hidden;position:relative;background:var(--deep);margin-bottom:11px}.hero .copy{inset:auto 15px 15px}.hero .copy h1{font-size:30px}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:0 0 18px}.quick button{border:1px solid var(--line);background:#fff;border-radius:15px;padding:10px 3px;color:var(--ink);font-size:10px;font-weight:900}.quick i{display:block;font-style:normal;color:var(--cyan);font-size:23px;margin-bottom:4px}
.title{font-size:22px;margin:17px 2px 10px;font-weight:1000}.daycard,.card{background:#fff;border:1px solid var(--line);border-radius:18px;margin-bottom:11px;box-shadow:0 5px 16px #063e5a0d}.dayhead{padding:13px 15px;background:linear-gradient(90deg,#dff7fb,#fff);border-radius:18px 18px 0 0;font-weight:1000}.event{display:grid;grid-template-columns:54px 1fr;gap:9px;padding:12px 14px;border-top:1px solid #edf3f5;position:relative}.event:after{content:"";position:absolute;inset-inline-start:61px;top:18px;width:7px;height:7px;border-radius:50%;background:var(--cyan)}.event .body{padding-inline-start:10px}.time{direction:ltr;color:var(--blue);font-weight:1000}.event h3,.place h3{font-size:14px;margin:0 0 4px}.muted{font-size:11px;line-height:1.55;color:var(--muted)}.pill{display:inline-block;margin-top:7px;padding:7px 9px;border-radius:9px;background:#dff7fb;color:#08758d;text-decoration:none;font-size:10px;font-weight:900}.route{display:block;margin:0 0 11px;text-align:center;padding:12px;border-radius:13px;background:var(--blue);color:#fff;text-decoration:none;font-weight:900}
.place{display:grid;grid-template-columns:90px 1fr;gap:11px;padding:11px}.place.noimg{grid-template-columns:1fr}.photo{width:90px;height:82px;border-radius:12px;overflow:hidden}.tools{padding:14px}.tools h3{margin:0 0 5px}.translate{background:linear-gradient(145deg,#063e5a,#087b9b);color:#fff}.translate .muted{color:#daf5f8}.demo{margin-top:10px;padding:10px;border-radius:12px;background:#ffffff16}.demo textarea{width:100%;min-height:68px;border:0;border-radius:10px;padding:10px;resize:none}.demo button{border:0;border-radius:10px;background:var(--cyan);color:var(--deep);padding:9px 11px;margin-top:7px;font-weight:900}.weather{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.sun{font-size:42px}.lock{text-align:center;padding:16px;background:#fff9e8;border-style:dashed}
.bottom{position:fixed;bottom:0;left:0;right:0;max-width:760px;margin:auto;height:70px;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr 1.12fr 1fr 1fr;z-index:20}.nav{border:0;background:transparent;color:#71868e;font-size:10px;font-weight:800}.nav b{display:block;font-size:20px;color:#0a7996;margin-bottom:3px}.avia{position:relative;top:-11px;color:#087b9b}.avia b{display:grid;place-items:center;width:52px;height:52px;margin:auto;border-radius:50%;background:#fff;border:3px solid var(--cyan);box-shadow:0 5px 15px #087b9b2b}
@media(max-width:390px){.cover{min-height:390px}.quick{gap:5px}.quick button{font-size:9px}}
</style></head><body>
<div id="load" class="load">NAVIGAM…</div>
<section id="gate" class="gate hide"><img class="logo" src="/assets/navigam/logo.png"><div class="cover"><img id="splash"><div class="shade"></div><div class="copy"><small>NAVIGAM PREVIEW</small><h1 id="dest0"></h1><div id="tag0"></div></div></div><button class="start" id="enter"></button></section>
<section id="app" class="app hide"><header class="top"><button class="iconbtn" onclick="go('home')">⌂</button><img class="logo" src="/assets/navigam/logo.png"><button class="iconbtn" onclick="go('tools')">☰</button></header><main class="main"><section id="home" class="screen on"></section><section id="trip" class="screen"></section><section id="places" class="screen"></section><section id="tools" class="screen"></section><section id="info" class="screen"></section></main><nav class="bottom"><button class="nav" onclick="go('home')"><b>⌂</b><span id="nh"></span></button><button class="nav" onclick="go('trip')"><b>⌁</b><span id="nt"></span></button><button class="nav avia" onclick="go('tools')"><b>✦</b>Avia</button><button class="nav" onclick="go('places')"><b>⌖</b><span id="np"></span></button><button class="nav" onclick="go('info')"><b>•••</b><span id="ni"></span></button></nav></section>
<script>
const API='https://asnnvwoersrhrgdantll.supabase.co/functions/v1/triply-preview-app';let D,L,T;
const I={ar:{open:'ابدأ رحلتك',home:'الرئيسية',trip:'الرحلة',places:'الأماكن',info:'المزيد',tag:'رحلتك بأسلوبك الخاص',day:'جدول رحلتي',translate:'ترجمة حية',weather:'الطقس',map:'Google Maps',locked:'بقية الرحلة متاحة في النسخة الكاملة',tools:'أدوات السفر'},he:{open:'התחל את הטיול',home:'בית',trip:'הטיול',places:'מקומות',info:'עוד',tag:'הטיול שלך, בדרך שלך',day:'לוח הטיול',translate:'תרגום חי',weather:'מזג אוויר',map:'Google Maps',locked:'שאר הטיול זמין בגרסה המלאה',tools:'כלים לטיול'},en:{open:'Start your trip',home:'Home',trip:'Trip',places:'Places',info:'More',tag:'Your trip, your way',day:'My itinerary',translate:'Live Translate',weather:'Weather',map:'Google Maps',locked:'The rest is available in the full version',tools:'Travel tools'},ru:{open:'Начать путешествие',home:'Главная',trip:'Поездка',places:'Места',info:'Ещё',tag:'Ваше путешествие — по-вашему',day:'Мой маршрут',translate:'Перевод',weather:'Погода',map:'Google Maps',locked:'Остальная поездка доступна в полной версии',tools:'Инструменты'}};
function e(s){return String(s==null?'':s).replace(/[&<>"']/g,function(ch){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]})}
function img(x){return x&&x.place&&(x.place.preview_image_url||(x.place.metadata&&x.place.metadata.preview_image_url))}
function map(x){return x&&x.place&&x.place.google_maps_url||'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(x&&x.place?x.place.name:x.title)}
function route(items){let p=items.filter(x=>x.place).map(x=>x.place.name||x.title);if(!p.length)return'#';if(p.length===1)return'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(p[0]);return'https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(p[0])+'&destination='+encodeURIComponent(p[p.length-1])+(p.length>2?'&waypoints='+encodeURIComponent(p.slice(1,-1).join('|')):'')+'&travelmode=walking'}
function go(id){document.querySelectorAll('.screen').forEach(x=>x.classList.toggle('on',x.id===id));scrollTo(0,0)}
function enter(){gate.classList.add('hide');app.classList.remove('hide');go('home')}
function event(x){return '<div class="event"><div class="time">'+e((x.start_time||'').slice(0,5))+'</div><div class="body"><h3>'+e(x.title)+'</h3><div class="muted">'+e(x.description||'')+'</div>'+(x.place?'<a class="pill" target="_blank" rel="noopener" href="'+e(map(x))+'">📍 '+e(T.map)+'</a>':'')+'</div></div>'}
function render(){L=D.language||'en';T=I[L]||I.en;document.documentElement.lang=L;document.documentElement.dir=/^(ar|he)$/.test(L)?'rtl':'ltr';nh.textContent=T.home;nt.textContent=T.trip;np.textContent=T.places;ni.textContent=T.info;enter.textContent=T.open;dest0.textContent=D.trip.destination;tag0.textContent=T.tag;let hero=D.trip.hero_image_url||'',sp=D.trip.splash_image_url||hero,items=D.items||[];if(sp){splash.src=sp;splash.onerror=()=>splash.style.display='none'}else splash.style.display='none';
let heroHTML='<div class="hero">'+(hero?'<img src="'+e(hero)+'" onerror="this.style.display=\'none\'">':'')+'<div class="shade"></div><div class="copy"><small>NAVIGAM PREVIEW</small><h1>'+e(D.trip.destination)+'</h1><div>'+e(T.tag)+'</div></div></div>';
home.innerHTML=heroHTML+'<div class="quick"><button onclick="go(\'trip\')"><i>⌁</i>'+e(T.trip)+'</button><button onclick="go(\'places\')"><i>⌖</i>'+e(T.places)+'</button><button onclick="go(\'tools\')"><i>🌐</i>'+e(T.translate)+'</button><button onclick="go(\'tools\')"><i>☀</i>'+e(T.weather)+'</button></div><div class="daycard"><div class="dayhead">'+e(D.day.title||T.day)+'</div>'+items.slice(0,4).map(event).join('')+'</div><div class="card lock">🔒 '+e(T.locked)+'</div>';
trip.innerHTML='<h2 class="title">'+e(D.day.title||T.day)+'</h2><a class="route" target="_blank" rel="noopener" href="'+e(route(items))+'">🗺️ '+e(L==='ar'?'كل نقاط اليوم على خريطة واحدة':L==='he'?'כל נקודות היום במפה אחת':L==='ru'?'Все точки дня на одной карте':'All day points on one map')+'</a><div class="daycard">'+items.map(event).join('')+'</div><div class="card lock">🔒 '+e(T.locked)+'</div>';
places.innerHTML='<h2 class="title">'+e(T.places)+'</h2>'+items.filter(x=>x.place).map(x=>{let u=img(x);return'<div class="card place '+(u?'':'noimg')+'">'+(u?'<div class="photo"><img src="'+e(u)+'" onerror="this.closest('.place').classList.add('noimg');this.parentElement.remove()"></div>':'')+'<div><h3>'+e(x.place.name||x.title)+'</h3><div class="muted">'+e(x.description||'')+'</div><a class="pill" target="_blank" rel="noopener" href="'+e(map(x))+'">📍 '+e(T.map)+'</a></div></div>'}).join('');
let pair=L==='ar'?'العربية ⇄ لغة الوجهة':L==='he'?'עברית ⇄ שפת היעד':L==='ru'?'Русский ⇄ язык страны':'Your language ⇄ destination language';let hint=L==='ar'?'اكتب أو تحدث هنا…':L==='he'?'הקלד או דבר כאן…':L==='ru'?'Введите или говорите…':'Type or speak here…';
tools.innerHTML='<h2 class="title">'+e(T.tools)+'</h2><div class="card tools translate"><h3>🌐 NAVIGAM Translate</h3><b>'+e(pair)+'</b><div class="demo"><textarea placeholder="'+e(hint)+'"></textarea><button onclick="demo(this)">🎙️ '+e(T.translate)+'</button></div></div><div class="card tools"><div class="weather"><div><h3>☀ '+e(T.weather)+'</h3><div class="muted">'+e(L==='ar'?'يتم تحديث التوقع تلقائياً عندما تدخل تواريخ الرحلة نطاق التنبؤ الدقيق.':L==='he'?'התחזית תתעדכן אוטומטית כשהטיול ייכנס לטווח התחזית המדויקת.':L==='ru'?'Прогноз обновится автоматически, когда даты поездки войдут в точный диапазон.':'Forecast updates automatically when your dates enter the reliable forecast window.')+'</div></div><div class="sun">☀️</div></div></div><div class="card tools"><h3>✦ Avia</h3><div class="muted">'+e(L==='ar'?'مساعدتك الشخصية أثناء الرحلة':L==='he'?'העוזרת האישית שלך לאורך הטיול':L==='ru'?'Ваш личный помощник в поездке':'Your personal trip assistant')+'</div></div>';
info.innerHTML='<h2 class="title">'+e(T.info)+'</h2><div class="card tools"><b>NAVIGAM</b><div class="muted">'+e(T.tag)+'</div></div><div class="card lock">🔒 '+e(T.locked)+'</div>';load.classList.add('hide');gate.classList.remove('hide')}
function demo(b){let ta=b.parentElement.querySelector('textarea'),v=ta.value.trim();let o=b.parentElement.querySelector('.out');if(!o){o=document.createElement('div');o.className='out';o.style.marginTop='8px';b.parentElement.appendChild(o)}o.textContent=v?v:(L==='ar'?'معاينة الترجمة الحية':L==='he'?'הדגמת תרגום חי':L==='ru'?'Демо живого перевода':'Live translation demo')}
async function boot(){try{let part=location.pathname.split('/p/')[1];let code=(part?part.split('/')[0]:'')||new URLSearchParams(location.search).get('code');let r=await fetch(API+'?code='+encodeURIComponent(code),{cache:'no-store'});if(!r.ok)throw Error(r.status);D=await r.json();render()}catch(x){load.innerHTML='<div style="text-align:center"><img class="logo" style="width:140px" src="/assets/navigam/logo.png"><h2>Preview unavailable</h2></div>'}}boot();
</script></body></html>
