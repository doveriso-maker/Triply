<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#073752">
<title>NAVIGAM</title>
<link rel="stylesheet" href="/preview/premium.css">
<link rel="stylesheet" href="/preview/map.css">
</head>
<body>
<div id="previewGate" role="status" aria-live="polite">
  <div style="text-align:center;padding:28px"><img src="/preview/assets/header-logo.png" alt="NAVIGAM" class="gate-logo"><div id="previewGateMsg" style="margin-top:12px">NAVIGAM</div></div>
</div>


<div id="app" hidden inert>
<section id="splash" class="view active" aria-labelledby="welcomeHeadline"><img class="splash-background" src="/preview/assets/splash.png" alt="" aria-hidden="true"><div class="splash-content"><div id="welcomeLanguage"></div><div class="splash-brand"><div class="splash-logo-window"><img src="/preview/assets/splash-logo.png" alt="NAVIGAM"></div><p class="splash-tagline" data-i18n="splashTagline"></p></div><h1 id="welcomeHeadline" class="splash-headline"><span data-i18n="splashLine1"></span><span data-i18n="splashLine2"></span></h1><p id="welcomeTrip"></p><div class="splash-bottom"><button type="button" class="splash-start" onclick="enterApp()"><span data-i18n="start"></span><span class="start-arrow" aria-hidden="true"></span></button></div></div></section>
<section id="live" class="view">
<header class="appbar"><button class="side" aria-label="פרופיל והגדרות" onclick="openProfile()">☻</button><div class="logo approved-lockup"><img src="/preview/assets/header-logo.png" alt="NAVIGAM" class="approved-logo"></div><button class="side" aria-label="מסך פתיחה" onclick="goSplash()">↩</button></header>
<main id="main" class="main"></main>
<nav class="bottom" aria-label="NAVIGAM">
<button class="nav active" data-route="home" onclick="route('home')"><b>⌂</b><span data-i18n="home"></span></button>
<button class="nav" data-route="itinerary" onclick="route('itinerary')"><b>🗓</b><span data-i18n="itinerary"></span></button>
<button class="nav avia" onclick="openAvia('chat')"><b><svg class="avia-svg" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="31" fill="#eefbff"/><circle cx="32" cy="28" r="14" fill="#f2c9aa"/><path d="M18 25c1-10 7-17 14-17 8 0 14 7 14 17-3-3-8-5-14-5s-11 2-14 5z" fill="#113e59"/><path d="M18 25c0-7 6-16 14-16" fill="none" stroke="#113e59" stroke-width="8" stroke-linecap="round"/><path d="M46 25c0-7-6-16-14-16" fill="none" stroke="#113e59" stroke-width="8" stroke-linecap="round"/><circle cx="27" cy="29" r="1.5" fill="#1d3141"/><circle cx="37" cy="29" r="1.5" fill="#1d3141"/><path d="M28 36c2 1.7 6 1.7 8 0" fill="none" stroke="#b36a5d" stroke-width="2" stroke-linecap="round"/><path d="M17 57c3-9 11-13 15-13s12 4 15 13" fill="#2ad1e4"/></svg></b><span data-i18n="avia"></span></button>
<button class="nav" data-route="map" onclick="route('map')"><b>⌖</b><span data-i18n="map"></span></button>
<button class="nav" data-route="favorites" onclick="route('favorites')"><b>♡</b><span data-i18n="favorites"></span></button>
</nav>
</section>
<div id="sheetback" class="sheetback" onclick="if(event.target===this)closeSheet()"><div id="sheet" class="sheet" role="dialog" aria-modal="true" aria-label="NAVIGAM"></div></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
</div>


<script src="/preview/i18n.js"></script>
<script src="/preview/adapter.js"></script>
<script src="/preview/boot.js"></script>
</body></html>
