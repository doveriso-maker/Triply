.bottom{position:fixed;z-index:30;left:12px;right:12px;bottom:calc(9px + var(--safeB));height:74px;border-radius:24px;background:rgba(255,255,255,.98);border:1px solid #deedf2;box-shadow:0 12px 34px rgba(6,55,77,.18);display:grid;grid-template-columns:1fr 1fr 1.12fr 1fr 1fr;align-items:center;padding:4px 7px}.nav{border:0;background:transparent;color:var(--navy);opacity:.68;display:grid;place-items:center;gap:2px;font-size:9px;font-weight:850}.nav b{font-size:20px}.nav.active{opacity:1;color:#007b95}.nav.active b{background:#dcf9fc;border-radius:11px;padding:3px 11px}.nav.avia{position:relative;top:-13px;opacity:1}.nav.avia b{width:55px;height:55px;border-radius:50%;background:#fff;border:3px solid #c5f5f8;display:grid;place-items:center;box-shadow:0 8px 20px rgba(4,89,108,.16);overflow:hidden}.nav.avia img{width:46px;height:46px;object-fit:contain}.nav.avia span{margin-top:-3px}

<div id="app">

    <button class="nav" data-route="itinerary"><b>≡</b><span id="navTrip"></span></button>

</section>
</div>

const C={
 ru:{home:'Главная',trip:'Маршрут',places:'Места',info:'Инфо',start:'Открыть Preview',preview:'Персональный Preview · день 1',next:'Дальше по маршруту',view:'Открыть',route:'Маршрут дня',allMaps:'Весь день в Google Maps',firstWaze:'Первая точка в Waze',day:'День',locked:'закрыт',spots:'Места дня',atmo:'Фото для атмосферы',around:'По вашему маршруту',fullTitle:'Остальные дни остаются закрыты',fullText:'Это демонстрация первого дня. После продолжения мы достроим остальные дни вокруг ваших предпочтений.',avia:'Avia в полной версии помогает во время поездки: маршрут, подсказки, перевод и изменения по ходу дня.',cta:'Хочу продолжить с NAVIGAM',dates:'Даты',expires:'Preview доступен до',personal:'Ваш первый день в приложении NAVIGAM',food:'Еда',map:'Навигация',lockedTab:'🔒',info1:'Только день 1 открыт в Preview',info2:'Все собранные предпочтения сохраняются — повторять анкету не нужно.',info3:'Полная версия открывает остальные дни и сопровождение Avia.'},

 he:{home:'בית',trip:'המסלול',places:'מקומות',info:'מידע',start:'פתח את ה־Preview',preview:'Preview אישי · יום 1',next:'הבא במסלול',view:'פתח',route:'מסלול היום',allMaps:'כל היום ב־Google Maps',firstWaze:'הנקודה הראשונה ב־Waze',day:'יום',locked:'נעול',spots:'מקומות ביום',atmo:'תמונת אווירה',around:'לאורך המסלול שלך',fullTitle:'שאר הימים נשארים נעולים',fullText:'זו הדגמה של היום הראשון. אחרי שממשיכים אנחנו משלימים את יתר הימים סביב ההעדפות שלך.',avia:'בגרסה המלאה אביה מלווה אותך בזמן הטיול: מסלול, המלצות, תרגום ושינויים תוך כדי היום.',cta:'אני רוצה להמשיך עם NAVIGAM',dates:'תאריכים',expires:'ה־Preview פתוח עד',personal:'היום הראשון שלך באפליקציית NAVIGAM',food:'אוכל',map:'ניווט',lockedTab:'🔒',info1:'רק יום 1 פתוח ב־Preview',info2:'כל מה שכבר סיפרת לנו נשמר — לא שואלים שוב.',info3:'הגרסה המלאה פותחת את שאר הימים ואת הליווי של אביה.'}
};
let D=null,L='he',T=C.he,route='home';

function imgFor(x){return x?.place?.preview_image_url||x?.place?.metadata?.preview_image_url||x?.place?.metadata?.image_url||null}
function hero(){return D?.trip?.hero_image_url||null}\nfunction splashImage(){return D?.trip?.splash_image_url||hero()}
function mapsUrl(x){return x?.place?.google_maps_url||('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(x?.place?.address||x?.place?.name||x?.title||D.trip.destination))}
function wazeUrl(x){return 'https://www.waze.com/ul?q='+encodeURIComponent(x?.place?.address||x?.place?.name||x?.title||D.trip.destination)+'&navigate=yes'}

 const first=D.items?.[0]||{}, total=daysBetween(D.trip.start_date,D.trip.end_date);

 <div class="card previewBanner"><strong>NAVIGAM Preview</strong><p>${esc(T.fullText)}</p></div>`;
}
function tabs(){const n=daysBetween(D.trip.start_date,D.trip.end_date);let out='<div class="daytabs"><button class="daytab active">'+esc(T.day)+' 1</button>';for(let i=2;i<=Math.min(n,7);i++)out+='<button class="daytab locked" type="button">'+esc(T.lockedTab)+' '+esc(T.day)+' '+i+'</button>';return out+'</div>'}
function renderItinerary(){
 const items=D.items||[];
 $('#itinerary').innerHTML=`<div class="screenTitle">${esc(T.trip)}</div><div class="tripHead"><h2>${esc(D.trip.destination)}</h2><p>${esc(D.day.title||'')}</p>${hero()?`<div class="tripCover"><img src="${esc(hero())}" alt=""></div>`:''}</div>${tabs()}
 <div class="timeline">${items.map(x=>`<div class="event"><div class="etime">${esc((x.start_time||'').slice(0,5)||'—')}</div><div class="dot"></div><div class="ebody"><strong>${esc(x.title)}</strong><small>${esc(x.description||'')}</small></div><button class="navbtn" onclick="window.open('${esc(mapsUrl(x))}','_blank')">⌖</button></div>`).join('')}</div>
 <div class="routeCard"><h3>${esc(T.route)}</h3><p>${esc(D.day.summary||'')}</p><div class="routeBtns"><a target="_blank" rel="noopener" href="${esc(allMaps())}">${esc(T.allMaps)}</a><a target="_blank" rel="noopener" href="${esc(items[0]?wazeUrl(items[0]):'#')}">${esc(T.firstWaze)}</a></div></div>
 <div class="lockedBox"><b>🔒</b><h3>${esc(T.fullTitle)}</h3><p>${esc(T.fullText)}</p></div>`;
}
function renderPlaces(){
 const items=(D.items||[]).filter(x=>x.place);
 $('#places').innerHTML=`<div class="screenTitle">${esc(T.spots)}</div><div class="placeList">${items.map(x=>`<div class="card place ${imgFor(x)?``:`noimg`}">${imgFor(x)?`<div class="thumb"><img src="${esc(imgFor(x))}" alt=""><span class="atmo">NAVIGAM</span></div>`:'' }<div><h3>${esc(x.place?.name||x.title)}</h3><p>${esc(x.description||'')}</p><span class="tag">${esc(x.place?.category||x.item_type||'')}</span></div><button class="go" onclick="window.open('${esc(mapsUrl(x))}','_blank')">⌖</button></div>`).join('')}</div>`;
}
function renderInfo(){
 $('#info').innerHTML=`<div class="screenTitle">${esc(T.info)}</div><div class="infoGrid">
 <div class="card info"><div class="ico">◷</div><div><strong>${esc(T.expires)}</strong><p>${esc(D.expires_at?fmtExpiry(D.expires_at):(L==='ru'?'24 часа начнутся после отправки клиенту':L==='ar'?'تبدأ الـ24 ساعة بعد إرسال الرابط للعميل':'24 השעות יתחילו מרגע שליחת הקישור ללקוח'))}</p></div></div>
 <div class="card info"><div class="ico">1</div><div><strong>${esc(T.info1)}</strong><p>${esc(D.day.title||'')}</p></div></div>
 <div class="card info"><div class="ico">✓</div><div><strong>${esc(T.info2)}</strong><p>${esc(T.around)}</p></div></div>
 <div class="card info"><div class="ico">◎</div><div><strong>${esc(T.info3)}</strong><p>NAVIGAM + Avia</p></div></div></div>
 <div class="lockedBox"><b>🔒</b><h3>${esc(T.fullTitle)}</h3><p>${esc(T.fullText)}</p></div>`;
}
function render(){renderHome();renderItinerary();renderPlaces();renderInfo()}
function go(r){route=r;$$('.screen').forEach(x=>x.classList.toggle('active',x.dataset.screen===r));$$('.nav[data-route]').forEach(x=>x.classList.toggle('active',x.dataset.route===r));$('.main').scrollTop=0}
async function fetchPreview(linkValue,kind='token',attempt=1){
 const ctl=new AbortController();const timer=setTimeout(()=>ctl.abort(),9000);
 try{
   const r=await fetch(API+'?'+kind+'='+encodeURIComponent(linkValue),{cache:'no-store',signal:ctl.signal});
   if(!r.ok)throw Error(r.status===401?'expired':'http_'+r.status);
   return await r.json();
 }catch(e){
   if(attempt<2){await new Promise(res=>setTimeout(res,650));return fetchPreview(linkValue,kind,attempt+1)}
   throw e;
 }finally{clearTimeout(timer)}
}
function showLoadError(){
 const b=$('#startBtn');b.disabled=false;b.style.opacity='1';b.textContent=L==='ru'?'Повторить загрузку':L==='ar'?'إعادة المحاولة':'נסה שוב';
 $('#splashTitle').textContent=L==='ru'?'Не удалось загрузить Preview':L==='ar'?'تعذر تحميل الـ Preview':'לא הצלחנו לטעון את ה־Preview';
 b.onclick=()=>{b.disabled=true;b.style.opacity='.65';b.textContent='NAVIGAM Preview…';load()};
}
async function load(){
 const params=new URLSearchParams(location.search);
 const token=params.get('token');
 const pathCode=location.pathname.startsWith('/p/')?location.pathname.slice(3).split('/')[0]:null;
 const code=params.get('code')||pathCode;
 if(!token&&!code){showLoadError();return}
 try{
   D=await fetchPreview(token||code,token?'token':'code');
   L=D.language||'he';T=C[L]||C.he;setChrome();
   if(splashImage()){$('#splashImage').src=splashImage();$('#splashImage').onerror=()=>{$('#splashImage').style.display='none';$('#splashImage').parentElement.classList.add('noimage')}}else{$('#splashImage').style.display='none'}
   $('#splashTitle').textContent=D.trip.destination;$('#splashBadge').textContent='NAVIGAM PREVIEW · '+fmtDate(D.day.trip_date);
   render();
   const enter=()=>{$('#splash').style.display='none';$('#splash').classList.remove('active');$('#live').style.display='block';$('#live').classList.add('active');go('home')};
   const b=$('#startBtn');b.disabled=false;b.style.opacity='1';b.textContent=T.start;b.onclick=enter;
   setTimeout(enter,900);
 }catch(e){
   console.error('NAVIGAM preview load failed',e);
   showLoadError();
 }
}
window.addEventListener('error',e=>{console.error('NAVIGAM runtime error',e.error||e.message)});

$$('.nav[data-route]').forEach(b=>b.onclick=()=>go(b.dataset.route));$('#homeBtn').onclick=()=>go('home');$('#backBtn').onclick=()=>history.length>1?history.back():go('home');
$('#aviaBtn').onclick=()=>$('#sheetBack').classList.add('show');$('#closeSheet').onclick=()=>$('#sheetBack').classList.remove('show');$('#sheetBack').onclick=e=>{if(e.target===$('#sheetBack'))$('#sheetBack').classList.remove('show')};
load().catch(()=>{$('#loading').innerHTML='<div class="error"><img src="/assets/navigam/logo.png" style="width:140px"><h2>NAVIGAM Preview</h2><p>This preview link is unavailable or has expired.</p></div>'});
</script>
</body>
</html>
