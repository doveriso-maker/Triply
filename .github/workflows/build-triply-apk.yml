name: Build TRIPLY Premium Android APK

on:
  push:
    branches:
      - triply-premium-apk
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package.json

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: npm install

      - name: Prepare TRIPLY web bundle
        run: |
          test -f dist/index.html
          cp triply-logo-transparent.png dist/triply-logo.png
          grep -q "החליקו לחופשה" dist/index.html
          grep -qi "open-meteo" dist/index.html

      - name: Create Capacitor Android project
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Apply TRIPLY launcher icon
        run: |
          mkdir -p android/app/src/main/res/drawable-nodpi
          cp icon-512.png android/app/src/main/res/drawable-nodpi/triply_icon.png
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          s=s.replace('@mipmap/ic_launcher_round','@drawable/triply_icon')
          s=s.replace('@mipmap/ic_launcher','@drawable/triply_icon')
          p.write_text(s)
          PY

      - name: Build installable debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify and name APK
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | grep -q AndroidManifest.xml
          unzip -l "$APK" | grep -q classes.dex
          unzip -l "$APK" | grep -q "public/index.html"
          cp "$APK" TRIPLY_SAPIR_ALBANIA_PREMIUM.apk
          sha256sum TRIPLY_SAPIR_ALBANIA_PREMIUM.apk > TRIPLY_SAPIR_ALBANIA_PREMIUM.apk.sha256
          ls -lh TRIPLY_SAPIR_ALBANIA_PREMIUM.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TRIPLY-SAPIR-ALBANIA-PREMIUM-APK
          path: |
            TRIPLY_SAPIR_ALBANIA_PREMIUM.apk
            TRIPLY_SAPIR_ALBANIA_PREMIUM.apk.sha256
          if-no-files-found: error
          retention-days: 7
