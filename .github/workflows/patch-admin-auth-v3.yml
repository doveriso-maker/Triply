name: Patch admin auth v3

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-admin-auth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Disable duplicate Supabase URL session detection
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('admin.html')
          s = p.read_text(encoding='utf-8')
          old = "detectSessionInUrl:true"
          new = "detectSessionInUrl:false"
          if new in s:
              print('Duplicate URL session detection already disabled')
              raise SystemExit(0)
          if old not in s:
              raise SystemExit('Could not find detectSessionInUrl:true in admin.html')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          print('Disabled automatic URL session handling')
          PY
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet -- admin.html; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html
          git commit -m "Prevent duplicate admin magic-link consumption"
          git push
