name: Install TikTok Pixel

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-tiktok-pixel.yml'

permissions:
  contents: write

jobs:
  install-pixel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inject TikTok Pixel into homepage
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          pixel_id = 'DAIGL6RC77UC8FLK30DG'

          if pixel_id in text:
              print('TikTok Pixel already installed; no change needed.')
              raise SystemExit(0)

          snippet = '''<!-- TikTok Pixel Code Start -->
          <script>
          !function (w, d, t) {
            w.TiktokAnalyticsObject=t;var ttq=w[t]=w[t]||[];ttq.methods=["page","track","identify","instances","debug","on","off","once","ready","alias","group","enableCookie","disableCookie","holdConsent","revokeConsent","grantConsent"],ttq.setAndDefer=function(t,e){t[e]=function(){t.push([e].concat(Array.prototype.slice.call(arguments,0)))}};for(var i=0;i<ttq.methods.length;i++)ttq.setAndDefer(ttq,ttq.methods[i]);ttq.instance=function(t){for(var e=ttq._i[t]||[],n=0;n<ttq.methods.length;n++)ttq.setAndDefer(e,ttq.methods[n]);return e},ttq.load=function(e,n){var r="https://analytics.tiktok.com/i18n/pixel/events.js",o=n&&n.partner;ttq._i=ttq._i||{},ttq._i[e]=[],ttq._i[e]._u=r,ttq._t=ttq._t||{},ttq._t[e]=+new Date,ttq._o=ttq._o||{},ttq._o[e]=n||{};n=document.createElement("script");n.type="text/javascript",n.async=!0,n.src=r+"?sdkid="+e+"&lib="+t;e=document.getElementsByTagName("script")[0];e.parentNode.insertBefore(n,e)};
            ttq.load('DAIGL6RC77UC8FLK30DG');
            ttq.page();
          }(window, document, 'ttq');
          </script>
          <!-- TikTok Pixel Code End -->'''

          marker = '<head>'
          if marker not in text:
              raise SystemExit('Could not find <head> in index.html')

          text = text.replace(marker, marker + '\n' + snippet, 1)
          path.write_text(text, encoding='utf-8')
          print('TikTok Pixel injected into index.html')
          PY

      - name: Commit homepage change
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No index.html change to commit."
            exit 0
          fi
          git config user.name "TRIPLY Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Install TikTok Pixel on TRIPLY homepage"
          git push origin HEAD:main
