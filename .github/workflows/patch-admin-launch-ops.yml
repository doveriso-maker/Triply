name: Wire launch operations into admin

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add launch operations module
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('admin.html')
          s=p.read_text(encoding='utf-8')
          marker='admin-launch-ops.js'
          if marker in s:
              print('Launch operations already wired')
              raise SystemExit(0)
          needle='</body>'
          if needle not in s:
              raise SystemExit('admin body closing tag not found')
          s=s.replace(needle,'<script type="module" src="/admin-launch-ops.js"></script>\n</body>',1)
          p.write_text(s,encoding='utf-8')
          print('Launch operations wired')
          PY
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet -- admin.html; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html
          git commit -m "Add payments and client-link operations to admin"
          git push
