n class="section active" id="home"><div class="apphero"><div><h1 id="ttl">رحلتك</h1><p id="meta"></p></div></div><div class="grid" id="tiles"></div><div class="head"><div><h2>اليوم في الرحلة</h2><p>كل ما تحتاجه قريب منك</p></div></div><div id="today"></div></section><section class="section" id="schedule"><div class="head"><div><h2>المسار</h2><p>حسب الأيام والأوقات</p></div><button class="back" onclick="go('home')">⌂</button></div><div id="sched"></div></section><section class="section" id="food"><div class="head"><div><h2>الطعام والمطاعم</h2></div><button class="back" onclick="go('home')">⌂</button></div><div id="foodl"></div></section><section class="section" id="places"><div class="head"><div><h2>أماكننا</h2></div><button class="back" onclick="go('home')">⌂</button></div><div id="placesl"></div></section><section class="section" id="phrase"><div class="head"><div><h2>عبارات للسفر</h2></div><button class="back" onclick="go('home')">⌂</button></div><div id="phrasel"></div></section><section class="section" id="useful"><div class="head"><div><h2>معلومات مفيدة</h2></div><button class="back" onclick="go('home')">⌂</button></div><div id="usefull"></div></section></div><nav class="bottom" id="nav" style="display:none"></nav>`;loadApp()}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}let D,I={};function t(p,f=''){let v=I;for(const k of p.split('.'))v=v?.[k];return typeof v==='string'?v:f}function go(id){document.querySelectorAll('.section').forEach(x=>x.classList.toggle('active',x.id===id));document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.nav===id));scrollTo(0,0)}function fd(d){try{return new Intl.DateTimeFormat('ar-IL',{day:'numeric',month:'short',weekday:'short'}).format(new Date(d+'T12:00:00'))}catch{return d||''}}function acts(p){if(!p)return'';let a=[];if(p.google_maps_url)a.push(['📍 Google Maps',p.google_maps_url,'primary']);if(p.website)a.push(['🌐 الموقع' .id).slice(0,3):[];document.getElementById('today').innerHTML=d?`<div class="day"><div class="dayhead"><b>${esc(d.title||fd(d.trip_date))}</b><span>${fd(d.trip_date)}</span></div>${its.length?its.map(ev).join(''):'<div class="empty">اليوم مفتوح للتخطيط</div>'}</div>`:'<div class="empty">سيظهر المسار هنا</div>';document.getElementById('sched').innerHTML=(D.days||[]).map(d=>{let a=D.itinerary.filter(x=>x.trip_day_id===d.id);return`<div class="day"><div class="dayhead"><b>${esc(d.title||'')}</b><span>${fd(d.trip_date)}</span></div>${a.length?a.map(ev).join(''):'<div class="empty">لا توجد نقاط بعد</div>'}</div>`}).join('');let food=D.places.filter(p=>/food|restaurant|cafe|pizza|bakery|street/i.test(String(p?.metadata?.guide_section||p?.category||'')));document.getElementById('foodl').innerHTML=food.length?food.map(pc).join(''):'<div class="empty">ستظهر التوصيات هنا</div>';document.getElementById('placesl').innerHTML=D.places.length?D.places.map(pc).join(''):'<div class="empty">لا توجد أماكن محفوظة</div>';let pb=D.trip?.preferences?.phrasebook,ph=pb?.items||[];document.getElementById('phrasel').innerHTML=ph.length?ph.map(x=>`<div class="phrase"><b>${esc(x.he||'')}</b><div class="local">${esc(x.local||'')}</div>${x.phonetic_he?`<small>النطق: ${esc(x.phonetic_he)}</small>`:''}</div>`).join(''):'<div class="empty">سيتم إضافة دليل العبارات</div>';document.getElementById('usefull').innerHTML=`<div class="util"><b>✈️ الرحلات الجوية</b><p>${esc(D.trip.start_date||'')} — ${esc(D.trip.end_date||'')}</p></div><div class="util"><b>🏨 الفندق</b><p>${esc(D.trip.base_location||D.trip.destination||'')}</p></div><div class="util"><b>🆘 الطوارئ</b><p>112</p></div>`;let ns=[['home','⌂','الرئيسية'],['schedule','🗓️','المسار'],['food','🍽️','الطعام'],['places','📍','الأماكن'],['useful','☰','المزيد']];document.getElementById('nav').innerHTML=ns.map((x,i)=>`<button class="nav ${i?'':'active'}" data-nav="${x[0]}" onclick="go('${x[0]}')"><i>${x[1]}</i>${x[2]}</button>`).join('');document.getElementById('load').style.display='none';document.getElementById('app').style.display='block';document.getElementById('nav').style.display='grid'}catch{document.getElementById('load').innerHTML='<div class="error"><h2>تعذر فتح الرحلة</h2><p>تحققوا من الرابط أو حاولوا مرة أخرى.</p></div>'}}</script></body></html>
