<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b6578">
<title>TRIPLY Admin</title>
<style>
:root{--ink:#123f4b;--muted:#738a91;--teal:#0b7c90;--teal2:#0d5c73;--coral:#ff6b5d;--gold:#f3b638;--green:#27a878;--line:#dce9ec;--bg:#f5fafb;--white:#fff}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#eef8fa,#fff 30%,#f6fbfc);font-family:Arial,"Noto Sans Hebrew",sans-serif;color:var(--ink)}
button,input,select{font:inherit}.shell{max-width:960px;margin:auto;padding:18px 14px 80px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:10px}.brandmark{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,#0b7c90,#17324d);display:grid;place-items:center;color:#fff;font-weight:900;letter-spacing:.04em;box-shadow:0 10px 24px rgba(11,124,144,.18)}
.brand h1{font-size:20px;margin:0}.brand p{font-size:10px;color:var(--muted);margin:3px 0 0}.btn{border:0;border-radius:12px;padding:10px 13px;font-weight:800;cursor:pointer}.btn.primary{background:linear-gradient(135deg,var(--teal),var(--teal2));color:#fff}.btn.soft{background:#e9f5f7;color:var(--teal)}.btn.warn{background:#fff2e9;color:#c95a38}.btn.green{background:#eaf8f1;color:#18845f}.card{background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:0 10px 28px rgba(17,74,88,.06);margin-bottom:12px}
.auth{max-width:520px;margin:10vh auto 0}.auth h2{font-size:24px;margin:0 0 6px}.auth p{font-size:12px;color:var(--muted);line-height:1.6}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:10px;font-weight:900;color:#58717a}.field input,.field select{width:100%;border:1px solid #cfe0e4;border-radius:12px;padding:11px 12px;background:#fff;color:var(--ink);outline:none}.field input:focus,.field select:focus{border-color:#6bb9c5;box-shadow:0 0 0 3px rgba(11,124,144,.08)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{padding:14px;border-radius:18px;background:#fff;border:1px solid var(--line)}.stat strong{display:block;font-size:23px}.stat span{font-size:9px;color:var(--muted)}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:18px 0 10px}.toolbar h2{font-size:18px;margin:0}.trips{display:grid;gap:10px}.trip{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}.trip h3{margin:0 0 4px;font-size:15px}.trip .meta{font-size:10px;color:var(--muted);line-height:1.6}.trip .code{display:inline-block;font-size:8px;font-weight:900;color:#0b7c90;background:#e9f7f9;border-radius:999px;padding:4px 7px;margin-left:5px}.status{display:inline-block;font-size:8px;font-weight:900;border-radius:999px;padding:4px 7px}.status.published{color:#1c805e;background:#e9f7f0}.status.draft{color:#ae7130;background:#fff4df}.actions{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-start}.empty{text-align:center;padding:30px;color:var(--muted);font-size:12px;border:1px dashed #c9dce0;border-radius:18px}.notice{font-size:10px;color:#5d747c;background:#f1f8fa;border-radius:12px;padding:10px 12px;line-height:1.6;margin-top:10px}
.modal{position:fixed;inset:0;background:rgba(8,32,40,.45);display:none;align-items:flex-end;justify-content:center;padding:12px;z-index:30}.modal.show{display:flex}.sheet{width:min(620px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:24px;padding:18px;box-shadow:0 30px 80px rgba(0,0,0,.22)}.sheethead{display:flex;align-items:center;justify-content:space-between}.sheet h2{margin:0}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.loading{opacity:.55;pointer-events:none}
#app{display:none}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.formgrid{grid-template-columns:1fr}.trip{grid-template-columns:1fr}.actions{justify-content:flex-start}}
</style>
</head>
<body>
<div class="shell">
  <section id="auth" class="auth card">
    <div class="brand"><div class="brandmark">T</div><div><h1>TRIPLY Admin</h1><p>הטיול שלך. בדיוק בשבילך.</p></div></div>
    <h2>כניסה למערכת</h2>
    <p>הכנס את כתובת המייל של מנהל TRIPLY. נשלח אליך קישור כניסה חד־פעמי.</p>
    <div class="field"><label>אימייל</label><input id="loginEmail" type="email" autocomplete="email" placeholder="name@example.com"></div>
    <button class="btn primary" id="loginBtn">שלח קישור כניסה</button>
    <div id="authMsg" class="notice" style="display:none"></div>
  </section>

  <main id="app">
    <div class="top">
      <div class="brand"><div class="brandmark">T</div><div><h1>TRIPLY Admin</h1><p id="adminIdentity">מחובר</p></div></div>
      <button class="btn soft" id="logoutBtn">יציאה</button>
    </div>

    <div class="grid">
      <div class="stat"><strong id="statAll">0</strong><span>כל הטיולים</span></div>
      <div class="stat"><strong id="statPublished">0</strong><span>פורסמו</span></div>
      <div class="stat"><strong id="statDraft">0</strong><span>טיוטות</span></div>
      <div class="stat"><strong id="statUpcoming">0</strong><span>טיולים עתידיים</span></div>
    </div>

    <div class="toolbar">
      <h2>הטיולים שלי</h2>
      <button class="btn primary" id="newTripBtn">+ טיול חדש</button>
    </div>
    <div id="trips" class="trips"><div class="empty">טוען טיולים…</div></div>
  </main>
</div>

<div class="modal" id="tripModal">
  <div class="sheet">
    <div class="sheethead"><h2>טיול חדש</h2><button class="btn soft" id="closeModal">✕</button></div>
    <div class="formgrid">
      <div class="field"><label>שם הטיול</label><input id="newTitle" placeholder="למשל: ירח דבש באלבניה"></div>
      <div class="field"><label>יעד</label><input id="newDestination" placeholder="Albania"></div>
      <div class="field"><label>עיר בסיס</label><input id="newBase" placeholder="Durrës"></div>
      <div class="field"><label>אזור זמן</label><input id="newTimezone" value="Europe/Tirane"></div>
      <div class="field"><label>תאריך התחלה</label><input id="newStart" type="date"></div>
      <div class="field"><label>תאריך סיום</label><input id="newEnd" type="date"></div>
    </div>
    <button class="btn primary" id="createTripBtn">צור Trip חדש</button>
    <div id="createMsg" class="notice" style="display:none"></div>
  </div>
</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const CORE_URL='https://asnnvwoersrhrgdantll.supabase.co';
const CORE_KEY='sb_publishable_dZFP2IUafSBsNpsnc4e4Mw_rU0FQFJh';
const supabase=createClient(CORE_URL,CORE_KEY,{auth:{detectSessionInUrl:true,persistSession:true,autoRefreshToken:true}});

const $=s=>document.querySelector(s);
let currentUser=null, trips=[];

function msg(el,text,show=true){el.textContent=text;el.style.display=show?'block':'none'}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function tripUrl(code){return location.origin+'/trip/'+encodeURIComponent(code)}
function dateHe(v){if(!v)return '';const d=new Date(v+'T12:00:00');return Number.isNaN(d.getTime())?v:d.toLocaleDateString('he-IL',{day:'numeric',month:'numeric',year:'2-digit'})}

async function ensureAdmin(){
  const {data:{session}}=await supabase.auth.getSession();
  if(!session?.user){showAuth();return false}
  currentUser=session.user;
  const {data,error}=await supabase.from('admin_users').select('role,display_name').eq('user_id',currentUser.id).maybeSingle();
  if(error||!data){
    await supabase.auth.signOut();
    showAuth();
    msg($('#authMsg'),'החשבון התחבר, אך עדיין לא הוגדר כמנהל TRIPLY. פנה לבעל המערכת להפעלה.');
    return false;
  }
  $('#adminIdentity').textContent=(data.display_name||currentUser.email)+' · '+data.role;
  $('#auth').style.display='none';$('#app').style.display='block';
  await loadTrips();
  return true;
}

function showAuth(){$('#app').style.display='none';$('#auth').style.display='block'}

async function loadTrips(){
  $('#trips').innerHTML='<div class="empty">טוען טיולים…</div>';
  const {data,error}=await supabase.from('trips')
    .select('trip_code,title,destination,base_location,start_date,end_date,status,updated_at')
    .order('created_at',{ascending:false});
  if(error){$('#trips').innerHTML='<div class="empty">לא ניתן לטעון טיולים.</div>';return}
  trips=data||[];
  renderStats();renderTrips();
}
function renderStats(){
  const today=new Date();today.setHours(0,0,0,0);
  $('#statAll').textContent=trips.length;
  $('#statPublished').textContent=trips.filter(t=>t.status==='published').length;
  $('#statDraft').textContent=trips.filter(t=>t.status==='draft').length;
  $('#statUpcoming').textContent=trips.filter(t=>new Date(t.start_date+'T12:00:00')>=today).length;
}
function renderTrips(){
  if(!trips.length){$('#trips').innerHTML='<div class="empty">אין עדיין טיולים. לחץ “טיול חדש” כדי ליצור את הראשון.</div>';return}
  $('#trips').innerHTML=trips.map(t=>`
    <article class="trip">
      <div>
        <h3><span class="code">Trip ${esc(t.trip_code)}</span>${esc(t.title)}</h3>
        <div class="meta">${esc(t.destination)}${t.base_location?' · '+esc(t.base_location):''}<br>${dateHe(t.start_date)}–${dateHe(t.end_date)} · <span class="status ${esc(t.status)}">${t.status==='published'?'פורסם':'טיוטה'}</span></div>
      </div>
      <div class="actions">
        <a class="btn soft" href="${tripUrl(t.trip_code)}" target="_blank" rel="noopener">פתח אפליקציה</a>
        ${t.status==='published'
          ? `<button class="btn warn" data-status="${esc(t.trip_code)}" data-next="draft">החזר לטיוטה</button>`
          : `<button class="btn green" data-status="${esc(t.trip_code)}" data-next="published">פרסם ללקוח</button>`}
      </div>
    </article>`).join('');
  document.querySelectorAll('[data-status]').forEach(b=>b.addEventListener('click',()=>changeStatus(b.dataset.status,b.dataset.next)));
}
async function changeStatus(code,next){
  const patch={status:next,published_at:next==='published'?new Date().toISOString():null};
  const {error}=await supabase.from('trips').update(patch).eq('trip_code',code);
  if(error){alert('לא ניתן לעדכן: '+error.message);return}
  await loadTrips();
}

$('#loginBtn').addEventListener('click',async()=>{
  const email=$('#loginEmail').value.trim();
  if(!email){msg($('#authMsg'),'הכנס כתובת אימייל.');return}
  $('#loginBtn').disabled=true;
  const {error}=await supabase.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+'/admin'}});
  $('#loginBtn').disabled=false;
  if(error){msg($('#authMsg'),'שגיאה בשליחת הקישור: '+error.message);return}
  msg($('#authMsg'),'שלחנו קישור כניסה למייל. פתח אותו באותו מכשיר.');
});
$('#logoutBtn').addEventListener('click',async()=>{await supabase.auth.signOut();location.reload()});
$('#newTripBtn').addEventListener('click',()=>$('#tripModal').classList.add('show'));
$('#closeModal').addEventListener('click',()=>$('#tripModal').classList.remove('show'));
$('#tripModal').addEventListener('click',e=>{if(e.target.id==='tripModal')$('#tripModal').classList.remove('show')});
$('#createTripBtn').addEventListener('click',async()=>{
  const title=$('#newTitle').value.trim(), destination=$('#newDestination').value.trim(),
    start=$('#newStart').value,end=$('#newEnd').value,base=$('#newBase').value.trim(),tz=$('#newTimezone').value.trim()||'Europe/Tirane';
  if(!title||!destination||!start||!end){msg($('#createMsg'),'חובה למלא שם, יעד ותאריכי התחלה/סיום.');return}
  if(end<start){msg($('#createMsg'),'תאריך הסיום חייב להיות אחרי תאריך ההתחלה.');return}
  $('#createTripBtn').disabled=true;
  const {data,error}=await supabase.rpc('triply_admin_create_trip',{p_title:title,p_destination:destination,p_start_date:start,p_end_date:end,p_base_location:base||null,p_timezone:tz});
  $('#createTripBtn').disabled=false;
  if(error){msg($('#createMsg'),'לא ניתן ליצור טיול: '+error.message);return}
  msg($('#createMsg'),'נוצר בהצלחה Trip '+data+'.');
  setTimeout(async()=>{$('#tripModal').classList.remove('show');await loadTrips()},700);
});

supabase.auth.onAuthStateChange(()=>setTimeout(ensureAdmin,0));
await ensureAdmin();
</script>
</body>
</html>
